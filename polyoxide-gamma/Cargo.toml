[package]
name = "polyoxide-gamma"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust client library for Polymarket Gamma (market data) API"
keywords = ["polymarket", "prediction-markets", "api", "gamma"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = []
specta = ["dep:specta"]

[dependencies]
polyoxide-core = { workspace = true }
polyoxide-venue = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["macros"] }
urlencoding = "2.1"
specta = { version = "=2.0.0-rc.20", features = ["derive", "serde", "chrono"], optional = true }

[dev-dependencies]
# The live suites' failure tags and credential loaders. Path-only: it is never
# published, and cargo strips a path-only dev-dependency on publish.
polyoxide-test-support = { path = "../polyoxide-test-support" }
mockito = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Registration, read by scripts/gen_registry.py: the README line, venue and
# product ids, the docs/specs/ mirrors covered, and one entry per live test
# target, which becomes a nightly job. Run `python3 scripts/gen_registry.py
# --write` after an edit.
[package.metadata.polyoxide]
readme = "Client library for Polymarket Gamma (market data) API"
venue = "polymarket"
products = ["gamma"]
mirrors = ["gamma"]

[package.metadata.polyoxide.live.live_api]
suite = "live"
timeout = 15
features = []
secrets = []
