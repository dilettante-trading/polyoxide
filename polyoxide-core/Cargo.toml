[package]
name = "polyoxide-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core utilities and shared types for the polyoxide venue clients: the HTTP send loop and its hooks, window quotas, capacity buckets and holds, errors and macros"
keywords = ["trading", "api", "core", "rate-limit"]
categories = ["api-bindings"]

[features]
default = []
keychain = ["dep:keyring"]

[dependencies]
polyoxide-venue = { workspace = true }
# The runtime every wait, clock read and spawn goes through. Core does not
# re-export it: a crate that names `Runtime` declares it itself.
polyoxide-rt = { workspace = true }
# The request vocabulary reqwest re-exports (`Method`, `StatusCode`, `HeaderMap`,
# `HeaderValue`, `header`), re-exported as `polyoxide_core::http`. Reqwest 0.12
# is built on `http` 1, so these are the same types.
http = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
# The body type of `HttpRequest` and `Response`; reqwest builds it already.
bytes = "1"
governor = { workspace = true }
dynosaur = { workspace = true }
fastrand = { workspace = true }
keyring = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }

# The one HTTP client, and the only member that declares it (AD-18): no other
# crate declares reqwest, so none can change its features for the rest. Core
# re-exports it as `polyoxide_core::reqwest` for `ReqwestTransport::new` and
# for the tests and examples that open raw clients. `gzip` is on, so every
# client asks for compressed bodies unless a builder turns it off.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip"], default-features = false }

# The browser's `fetch`, through reqwest's wasm client (`FetchTransport`): no
# TLS, no compression setting and no pool, since the browser has its own.
# Beyond spec D10: fastrand's `js` feature seeds the retry jitter, which otherwise has one fixed seed on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false }
send_wrapper = { workspace = true, features = ["futures"] }
fastrand = { workspace = true, features = ["js"] }

[dev-dependencies]
mockito = { workspace = true }
serde = { workspace = true }
# The send loop's tests read its warnings.
tracing-subscriber = { workspace = true }
# `test-util` gives the cooldown tests a paused clock, so they assert the full
# backoff without actually sleeping for it.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

# Registration, read by scripts/gen_registry.py: the README line, venue and
# product ids, the docs/specs/ mirrors covered, and one entry per live test
# target, which becomes a nightly job. Run `python3 scripts/gen_registry.py
# --write` after an edit.
[package.metadata.polyoxide]
readme = "Core utilities and shared types"
notes = ["the send loop and its hooks, the HTTP client, window quotas, capacity buckets, holds, errors, macros and the keychain; it names no venue, which `scripts/venue_gate.py` holds"]
