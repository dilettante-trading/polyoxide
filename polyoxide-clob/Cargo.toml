[package]
name = "polyoxide-clob"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust client library for Polymarket CLOB (order book) API"
keywords = ["polymarket", "prediction-markets", "trading", "clob"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = ["gamma"]
gamma = ["dep:polyoxide-gamma"]
ws = ["dep:tokio-tungstenite", "dep:futures-util", "tokio/net", "tokio/macros"]

[dependencies]
alloy = { version = "1.1.2", features = [
    "network",
    "signer-local",
    "signers",
    "sol-types",
] }
polyoxide-core = { workspace = true }
reqwest = { workspace = true }
polyoxide-gamma = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
url = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
rand = { version = "0.9.2", features = ["std"] }
rust_decimal = { workspace = true }
urlencoding = "2.1"
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
dotenvy = "0.15"
rust_decimal_macros = "1.37"
