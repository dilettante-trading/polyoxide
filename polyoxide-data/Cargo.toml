[package]
name = "polyoxide-data"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust client library for Polymarket Data API"
keywords = ["polymarket", "prediction-markets"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = []
specta = ["dep:specta"]

[dependencies]
futures-util = "0.3"
polyoxide-core = { workspace = true }
polyoxide-venue = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
# `rust_decimal` maps `Decimal` to `String` in the exported type graph, which
# is what it is on the wire. Without it, any specta-deriving type that reaches
# a `Decimal` fails to compile under `--all-features`.
specta = { version = "=2.0.0-rc.20", features = ["derive", "serde", "rust_decimal"], optional = true }

[dev-dependencies]
# The live suites' failure tags and credential loaders, and the agreement and
# soak helpers (`query` fires a builder at a mock server; `soak` is the
# harnesses' pacer, observer and verdicts). Path-only: it is never published,
# and cargo strips a path-only dev-dependency on publish.
polyoxide-test-support = { path = "../polyoxide-test-support", features = ["query", "soak"] }
mockito = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

# `cargo test` and `cargo nextest` build examples but do not run their unit
# tests unless asked, so the rate-limit harnesses' tests would otherwise never
# run in CI. The verdict rules that pinned `polymarket::data_limits`'s v2
# rows are polyoxide-test-support's `soak::verdict::tolerant`, tested there.
[[example]]
name = "v2_soak"
path = "examples/v2_soak/main.rs"
test = true

[[example]]
name = "closed_positions_soak"
path = "examples/closed_positions_soak.rs"
test = true

[[example]]
name = "closed_positions_burst_probe"
path = "examples/closed_positions_burst_probe.rs"
test = true

# Registration, read by scripts/gen_registry.py: the README line, venue and
# product ids, the docs/specs/ mirrors covered, and one entry per live test
# target, which becomes a nightly job. Run `python3 scripts/gen_registry.py
# --write` after an edit.
[package.metadata.polyoxide]
readme = "Client library for Polymarket Data API"
venue = "polymarket"
products = ["data"]
mirrors = ["data", "data-v2", "undocumented"]

[package.metadata.polyoxide.live.live_api]
suite = "live"
timeout = 15
features = []
secrets = []
