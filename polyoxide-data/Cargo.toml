[package]
name = "polyoxide-data"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust client library for Polymarket Data API"
keywords = ["polymarket", "prediction-markets"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = []
specta = ["dep:specta"]

[dependencies]
futures-util = "0.3"
polyoxide-core = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
# `rust_decimal` maps `Decimal` to `String` in the exported type graph, which
# is what it is on the wire. Without it, any specta-deriving type that reaches
# a `Decimal` fails to compile under `--all-features`.
specta = { version = "=2.0.0-rc.20", features = ["derive", "serde", "rust_decimal"], optional = true }

[dev-dependencies]
mockito = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# `cargo test` and `cargo nextest` build examples but do not run their unit
# tests unless asked, so the rate-limit harnesses' tests (including the
# verdict rules that pinned `RateLimiter::data_default`'s v2 rows) would
# otherwise never run in CI.
[[example]]
name = "v2_soak"
path = "examples/v2_soak/main.rs"
test = true

[[example]]
name = "closed_positions_soak"
path = "examples/closed_positions_soak.rs"
test = true

[[example]]
name = "closed_positions_burst_probe"
path = "examples/closed_positions_burst_probe.rs"
test = true
