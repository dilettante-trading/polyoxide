[package]
name = "polyoxide-perps"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust client library for the Polymarket Perps API"
keywords = ["polymarket", "perpetuals", "trading"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = []
# WebSocket streaming of the public channels.
ws = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:rustls", "tokio/net", "tokio/sync", "tokio/rt", "tokio/time", "tokio/macros"]
# Exposes the scripted local server for integration tests. Not for consumers.
test-server = ["ws"]

[dependencies]
polyoxide-core = { workspace = true }
polyoxide-venue = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }
# Needed only to install a process-default rustls CryptoProvider; see
# `ensure_crypto_provider` in src/ws/mod.rs.
rustls = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The live suites' failure tags and credential loaders, and the agreement and
# soak helpers (`query` fires a builder at a mock server; `soak` is the
# harnesses' pacer, observer and verdicts). Path-only: it is never published,
# and cargo strips a path-only dev-dependency on publish.
polyoxide-test-support = { path = "../polyoxide-test-support", features = ["query", "soak"] }
futures-util = "0.3"
mockito = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

# `cargo test` builds examples but does not run their unit tests unless
# asked; the harness's argument checks live here. The verdict rules that pin
# `polymarket::perps_limits` are polyoxide-test-support's
# `soak::verdict::strict`, tested there.
[[example]]
name = "info_soak"
path = "examples/info_soak.rs"
test = true

# The `ws` integration tests import items that only exist behind the feature;
# `required-features` keeps a plain `cargo test --all-targets` from trying to
# build them.
[[test]]
name = "ws_wire_agreement"
required-features = ["ws"]

[[test]]
name = "live_ws"
required-features = ["ws"]

# Registration, read by scripts/gen_registry.py: the README line, venue and
# product ids, the docs/specs/ mirrors covered, and one entry per live test
# target, which becomes a nightly job. Run `python3 scripts/gen_registry.py
# --write` after an edit.
[package.metadata.polyoxide]
readme = "Client library for Polymarket Perps (perpetual futures) public market data"
venue = "polymarket"
products = ["perps"]
mirrors = ["perps"]
notes = ["auth and trading pending"]

[package.metadata.polyoxide.live.live_api]
suite = "live"
timeout = 15
features = []
secrets = []

[package.metadata.polyoxide.live.live_ws]
suite = "live"
timeout = 15
features = ["ws"]
secrets = []
