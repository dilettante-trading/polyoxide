[workspace]
members = [
  "polyoxide",
  "polyoxide-cli",
  "polyoxide-clob",
  "polyoxide-core",
  "polyoxide-data",
  "polyoxide-gamma",
  "polyoxide-py",
  "polyoxide-relay",
]
resolver = "2"

[workspace.package]
version = "0.26.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Aidan Bailey"]
repository = "https://github.com/dilettante-trading/polyoxide"
rust-version = "1.91"

[workspace.dependencies]
polyoxide-core = { path = "polyoxide-core", version = "0.26.1" }
polyoxide-clob = { path = "polyoxide-clob", version = "0.26.1" }
polyoxide-gamma = { path = "polyoxide-gamma", version = "0.26.1" }
polyoxide-data = { path = "polyoxide-data", version = "0.26.1" }
polyoxide-relay = { path = "polyoxide-relay", version = "0.26.1" }
tokio = { version = "1.41" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
chrono = "0.4"
url = "2.5"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
rust_decimal = { version = "1.37", features = ["serde-with-str"] }
governor = { version = "0.8", features = ["std"] }
fastrand = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust"] }
mockito = "1.7"
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
pythonize = "0.28"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.ci]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16
