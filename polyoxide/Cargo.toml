[package]
name = "polyoxide"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Unified Rust client for Polymarket APIs (CLOB, Gamma, Data, RTDS, Perps and Sports)"
keywords = ["polymarket", "prediction-markets", "api", "trading"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = ["clob", "gamma", "data"]
clob = ["dep:polyoxide-clob"]
gamma = ["dep:polyoxide-gamma", "polyoxide-clob?/gamma"]
data = ["dep:polyoxide-data"]
ws = ["clob", "polyoxide-clob/ws"]
rtds = ["dep:polyoxide-rtds"]
perps = ["dep:polyoxide-perps"]
perps-ws = ["perps", "polyoxide-perps/ws"]
sports = ["dep:polyoxide-sports"]
full = ["clob", "gamma", "data", "ws", "rtds", "perps", "perps-ws", "sports"]
keychain = ["polyoxide-clob?/keychain"]

[dependencies]
polyoxide-gamma = { workspace = true, optional = true }
polyoxide-clob = { workspace = true, optional = true }
polyoxide-data = { workspace = true, optional = true }
polyoxide-rtds = { workspace = true, optional = true }
polyoxide-perps = { workspace = true, optional = true }
polyoxide-sports = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Needed only so the WebSocket README doctests can bring `StreamExt` into scope.
futures-util = "0.3"

# Registration, read by scripts/gen_registry.py: the README line, venue and
# product ids, the docs/specs/ mirrors covered, and one entry per live test
# target, which becomes a nightly job. Run `python3 scripts/gen_registry.py
# --write` after an edit.
[package.metadata.polyoxide]
readme = "Unified client for Polymarket APIs (CLOB, Gamma, Data, WebSocket, RTDS, Perps, Sports)"
