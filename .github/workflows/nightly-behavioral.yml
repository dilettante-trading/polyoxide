name: Nightly behavioral smoketest

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-behavioral
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # nextest's libtest-json output is experimental and refuses to run without
  # this opt-in. Without it every nightly would silently produce empty JSON
  # (the `|| true` swallows nextest's error) and report green regardless.
  NEXTEST_EXPERIMENTAL_LIBTEST_JSON: 1

jobs:
  test:
    name: Live tests (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `flags` selects each crate's live test binaries (and any features
        # they need). polyoxide-clob's WebSocket tests live in a separate
        # `live_ws` binary behind the non-default `ws` feature.
        include:
          - { crate: polyoxide-gamma, flags: "--test live_api" }
          - { crate: polyoxide-data,  flags: "--test live_api" }
          - { crate: polyoxide-clob,  flags: "--features ws --test live_api --test live_ws" }
          - { crate: polyoxide-relay, flags: "--test live_api" }
          - { crate: polyoxide-cli,   flags: "--test live_api" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: .github/scripts

      - name: Run live (no-auth) tests — first pass
        run: |
          mkdir -p artifacts/${{ matrix.crate }}
          cargo nextest run \
            -p ${{ matrix.crate }} ${{ matrix.flags }} \
            --run-ignored only \
            --no-fail-fast \
            --message-format libtest-json \
            > artifacts/${{ matrix.crate }}/first-pass.json 2>artifacts/${{ matrix.crate }}/first-pass.stderr || true
          # `|| true` exists so test failures don't stop the pipeline, but it
          # also swallows nextest refusing to run at all (build error, bad
          # flags). An empty JSON would classify as "no failures" — silent
          # green. Distinguish the two here: no output means infra failure.
          if [ ! -s artifacts/${{ matrix.crate }}/first-pass.json ]; then
            echo "::error::nextest produced no libtest-json output — build failure or bad invocation:"
            cat artifacts/${{ matrix.crate }}/first-pass.stderr
            exit 1
          fi

      - name: Classify first-pass failures
        run: |
          uv run python ${{ github.workspace }}/.github/scripts/classify_failures.py classify \
            --input ${{ github.workspace }}/artifacts/${{ matrix.crate }}/first-pass.json \
            --output-dir ${{ github.workspace }}/artifacts/${{ matrix.crate }}/classified
        working-directory: .github/scripts

      - name: Retry transient failures
        run: |
          # retry-filter.txt is a ready-made nextest filterset built by the
          # classifier: libtest-json names are `crate::binary$test`, so each
          # clause pins binary_id AND bare test name.
          FILTER_FILE="artifacts/${{ matrix.crate }}/classified/retry-filter.txt"
          if [ -s "$FILTER_FILE" ]; then
            cargo nextest run \
              -p ${{ matrix.crate }} ${{ matrix.flags }} \
              --run-ignored only \
              --no-fail-fast \
              --message-format libtest-json \
              --retries 2 \
              -E "$(cat "$FILTER_FILE")" \
              > artifacts/${{ matrix.crate }}/retry.json 2>artifacts/${{ matrix.crate }}/retry.stderr || true
          else
            echo '{"type":"suite","event":"started","test_count":0}' > artifacts/${{ matrix.crate }}/retry.json
            echo '{"type":"suite","event":"ok","passed":0,"failed":0,"ignored":0,"measured":0,"filtered_out":0,"exec_time":0.0}' >> artifacts/${{ matrix.crate }}/retry.json
          fi

      - name: Merge first-pass + retry
        run: |
          uv run python ${{ github.workspace }}/.github/scripts/classify_failures.py merge \
            --first-pass ${{ github.workspace }}/artifacts/${{ matrix.crate }}/first-pass.json \
            --retry ${{ github.workspace }}/artifacts/${{ matrix.crate }}/retry.json \
            --output-dir ${{ github.workspace }}/artifacts/${{ matrix.crate }}/merged
        working-directory: .github/scripts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-${{ matrix.crate }}
          path: artifacts/${{ matrix.crate }}/

  aggregate:
    name: Aggregate and report
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts/
          pattern: behavioral-*

      - name: Build combined report
        id: report
        run: |
          REPORT_FILE=$(mktemp)
          ANY_REAL_FAILURE="false"
          echo "# Nightly behavioral check — $(date -u +%Y-%m-%d)" > "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          for d in all-artifacts/behavioral-*; do
            crate=$(basename "$d" | sed 's/^behavioral-//')
            real_failures="$d/merged/real-failures.txt"
            report_md="$d/merged/report.md"
            if [ -s "$real_failures" ]; then
              ANY_REAL_FAILURE="true"
              echo "## ${crate}" >> "$REPORT_FILE"
              echo "" >> "$REPORT_FILE"
              cat "$report_md" >> "$REPORT_FILE"
              echo "" >> "$REPORT_FILE"
            fi
          done
          echo "any_real_failure=$ANY_REAL_FAILURE" >> "$GITHUB_OUTPUT"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

      - name: File or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          # --force makes this idempotent; without the label existing,
          # `gh issue create --label` fails outright.
          gh label create nightly-behavioral --force \
            --description "Filed by the nightly behavioral smoketest" --color D93F0B || true

          EXISTING=$(gh issue list --label nightly-behavioral --state open --json number --jq '.[0].number // empty')
          if [ "${{ steps.report.outputs.any_real_failure }}" = "true" ]; then
            BODY="$(cat ${{ steps.report.outputs.report_file }})"
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create \
                --title "Nightly behavioral check failed: $(date -u +%Y-%m-%d)" \
                --label nightly-behavioral \
                --body "$BODY"
            fi
          elif [ -n "$EXISTING" ] && [ "$TEST_RESULT" = "success" ]; then
            # Close only on a genuinely clean run. If a matrix entry died on
            # infrastructure (build failure, classifier crash, timeout), the
            # absence of failure reports proves nothing — leaving the issue
            # open beats falsely declaring recovery.
            gh issue close "$EXISTING" --comment "Recovered $(date -u +%Y-%m-%d)"
          fi
