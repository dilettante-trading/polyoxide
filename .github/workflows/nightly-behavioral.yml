name: Nightly behavioral smoketest

on:
  schedule:
    - cron: "0 6 * * *"
    # The sports feed carries only what is live, and 06:00 UTC misses North
    # American leagues and weekend soccer. Saturday and Sunday 18:30 UTC
    # catches NFL early games (17:00 or 18:00 UTC kickoffs), MLB and college
    # football afternoons, and European evening soccer, so the drift detector
    # sees their frames. NBA and NHL evening games, 00:00 to 03:00 UTC, stay
    # unseen. Every live job runs, so a clean run may still close the issue.
    - cron: "30 18 * * 6,0"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-behavioral
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # nextest's libtest-json output is experimental and refuses to run without
  # this opt-in. Without it every nightly would silently produce empty JSON
  # (the `|| true` swallows nextest's error) and report green regardless.
  NEXTEST_EXPERIMENTAL_LIBTEST_JSON: 1

jobs:
  # One job per (crate, suite), generated by scripts/gen_registry.py from each
  # crate's `[package.metadata.polyoxide.live]` entries. Jobs, not matrix rows,
  # because a matrix row cannot choose its secrets: each job's `env:` holds
  # exactly the secrets its targets declare. The steps are the composite action
  # in .github/actions/live-suite.
  #
  # `flags` selects each crate's live test binaries (and any features
  # they need). polyoxide-clob's, polyoxide-perps's and polyoxide-binance's
  # WebSocket tests live in a separate `live_ws` binary behind the
  # non-default `ws` feature.
  #
  # `live_session_keys` gets its own job because its registry and
  # transaction waits can legitimately take ~25 minutes, which would
  # kill live_api/live_ws with it under a shared 15-minute budget.
  # `suite` keeps the two clob jobs' artifact names distinct.
  # generated:begin nightly-live-jobs
  live-polyoxide-binance-live:
    name: Live tests (polyoxide-binance, live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/live-suite
        with:
          crate: polyoxide-binance
          suite: live
          flags: "--features ws --test live_api --test live_ws"

  live-polyoxide-data-live:
    name: Live tests (polyoxide-data, live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/live-suite
        with:
          crate: polyoxide-data
          suite: live
          flags: "--test live_api"

  live-polyoxide-gamma-live:
    name: Live tests (polyoxide-gamma, live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/live-suite
        with:
          crate: polyoxide-gamma
          suite: live
          flags: "--test live_api"

  live-polyoxide-perps-live:
    name: Live tests (polyoxide-perps, live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/live-suite
        with:
          crate: polyoxide-perps
          suite: live
          flags: "--features ws --test live_api --test live_ws"

  live-polyoxide-relay-live:
    name: Live tests (polyoxide-relay, live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILDER_API_KEY: ${{ secrets.BUILDER_API_KEY }}
      BUILDER_PASS_PHRASE: ${{ secrets.BUILDER_PASS_PHRASE }}
      BUILDER_SECRET: ${{ secrets.BUILDER_SECRET }}
      POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
      RELAYER_API_KEY: ${{ secrets.RELAYER_API_KEY }}
      RELAYER_API_KEY_ADDRESS: ${{ secrets.RELAYER_API_KEY_ADDRESS }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/live-suite
        with:
          crate: polyoxide-relay
          suite: live
          flags: "--test live_api"

  live-polyoxide-clob-live:
    name: Live tests (polyoxide-clob, live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POLYMARKET_API_KEY: ${{ secrets.POLYMARKET_API_KEY }}
      POLYMARKET_API_PASSPHRASE: ${{ secrets.POLYMARKET_API_PASSPHRASE }}
      POLYMARKET_API_SECRET: ${{ secrets.POLYMARKET_API_SECRET }}
      POLYMARKET_BUILDER_CODE: ${{ secrets.POLYMARKET_BUILDER_CODE }}
      POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/live-suite
        with:
          crate: polyoxide-clob
          suite: live
          flags: "--features ws --test live_api --test live_ws"

  live-polyoxide-clob-session-keys:
    name: Live tests (polyoxide-clob, session-keys)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILDER_API_KEY: ${{ secrets.BUILDER_API_KEY }}
      BUILDER_PASS_PHRASE: ${{ secrets.BUILDER_PASS_PHRASE }}
      BUILDER_SECRET: ${{ secrets.BUILDER_SECRET }}
      POLYMARKET_DW_OWNER_PRIVATE_KEY: ${{ secrets.POLYMARKET_DW_OWNER_PRIVATE_KEY }}
      POLYMARKET_DW_SESSION_PRIVATE_KEY: ${{ secrets.POLYMARKET_DW_SESSION_PRIVATE_KEY }}
      POLYMARKET_DW_WALLET: ${{ secrets.POLYMARKET_DW_WALLET }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/live-suite
        with:
          crate: polyoxide-clob
          suite: session-keys
          flags: "--test live_session_keys"

  live-polyoxide-rtds-live:
    name: Live tests (polyoxide-rtds, live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/live-suite
        with:
          crate: polyoxide-rtds
          suite: live
          flags: "--test live_api"

  live-polyoxide-sports-live:
    name: Live tests (polyoxide-sports, live)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/live-suite
        with:
          crate: polyoxide-sports
          suite: live
          flags: "--test live_api"

  live-polyoxide-cli-live:
    name: Live tests (polyoxide-cli, live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/live-suite
        with:
          crate: polyoxide-cli
          suite: live
          flags: "--test live_api"
  # generated:end nightly-live-jobs

  aggregate:
    name: Aggregate and report
    # generated:begin nightly-aggregate-needs
    needs:
      - live-polyoxide-binance-live
      - live-polyoxide-data-live
      - live-polyoxide-gamma-live
      - live-polyoxide-perps-live
      - live-polyoxide-relay-live
      - live-polyoxide-clob-live
      - live-polyoxide-clob-session-keys
      - live-polyoxide-rtds-live
      - live-polyoxide-sports-live
      - live-polyoxide-cli-live
    # generated:end nightly-aggregate-needs
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: all-artifacts/
          pattern: behavioral-*

      - name: Build combined report
        id: report
        run: |
          REPORT_FILE=$(mktemp)
          ANY_REAL_FAILURE="false"
          echo "# Nightly behavioral check — $(date -u +%Y-%m-%d)" > "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          for d in all-artifacts/behavioral-*; do
            crate=$(basename "$d" | sed 's/^behavioral-//')
            real_failures="$d/merged/real-failures.txt"
            report_md="$d/merged/report.md"
            if [ -s "$real_failures" ]; then
              ANY_REAL_FAILURE="true"
              echo "## ${crate}" >> "$REPORT_FILE"
              echo "" >> "$REPORT_FILE"
              cat "$report_md" >> "$REPORT_FILE"
              echo "" >> "$REPORT_FILE"
            fi
          done
          echo "any_real_failure=$ANY_REAL_FAILURE" >> "$GITHUB_OUTPUT"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

      - name: File or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Every needed job succeeded. `needs` is generated with the jobs, so a
          # live job missing from it cannot let this close the issue without
          # that job's artifact.
          ALL_SUCCEEDED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: |
          # --force makes this idempotent; without the label existing,
          # `gh issue create --label` fails outright.
          gh label create nightly-behavioral --force \
            --description "Filed by the nightly behavioral smoketest" --color D93F0B || true

          EXISTING=$(gh issue list --label nightly-behavioral --state open --json number --jq '.[0].number // empty')
          if [ "${{ steps.report.outputs.any_real_failure }}" = "true" ]; then
            BODY="$(cat ${{ steps.report.outputs.report_file }})"
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create \
                --title "Nightly behavioral check failed: $(date -u +%Y-%m-%d)" \
                --label nightly-behavioral \
                --body "$BODY"
            fi
          elif [ -n "$EXISTING" ] && [ "$ALL_SUCCEEDED" = "true" ]; then
            # Close only on a genuinely clean run. If a live job died on
            # infrastructure (build failure, classifier crash, timeout), the
            # absence of failure reports proves nothing — leaving the issue
            # open beats falsely declaring recovery.
            gh issue close "$EXISTING" --comment "Recovered $(date -u +%Y-%m-%d)"
          fi
