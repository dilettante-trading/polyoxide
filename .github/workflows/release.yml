name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Get Version
    # A release comes only from a push to main in this repository, or a manual run on
    # main. `branches: [main]` above is not enough on its own: it matches the triggering
    # run's head branch, which for a fork's pull request is the fork's branch name.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `decide` reads the tag and the GitHub release, and on a manual run CI's runs.
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Get commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.sha }}
          # The parent commit too, to tell a version-bump commit from any other.
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@stable

      - name: Read the version from cargo metadata
        id: version
        run: |
          VERSION=$(python3 scripts/publish_order.py version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      # The rules are `decide` in scripts/publish_order.py. A version already tagged
      # at another commit fails this job unless this push left the version alone, and
      # so does a failed lookup, which must never read as "not released yet".
      - name: Decide whether to release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.sha.outputs.sha }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          ARGS=(--head-sha "$HEAD_SHA")
          if [ "$DISPATCH" = "true" ]; then
            ARGS+=(--dispatch)
          fi
          DECISION=$(python3 scripts/publish_order.py decide "${ARGS[@]}")
          if [ "$DECISION" = "release" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  # A release that removes or breaks a public item must raise the 0.x minor
  # (AD-25). The baseline is the newest release tag behind this commit, not
  # v<the parent's version>: a bump whose CI went red, or whose release failed,
  # was never tagged. With no `--release-type`, cargo-semver-checks infers one
  # from the two versions, so on a patch bump any major-level change fails this
  # job, and both publish jobs wait for it.
  semver:
    name: Semver check against the previous release
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
          # Every tag, for the baseline.
          fetch-depth: 0

      # Pinned together with cargo-semver-checks, as in ci.yml's removals job:
      # 0.51.0 reads the rustdoc JSON that only Rust 1.93 to 1.99 emit.
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0

      - name: Check the public API against the previous release
        env:
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          BASELINE=$(python3 scripts/publish_order.py previous-tag "$SHA")
          python3 scripts/api_removals.py release --baseline "$BASELINE"

  publish:
    name: Publish to crates.io
    if: |
      needs.version.outputs.should_release == 'true' &&
      github.repository == 'dilettante-trading/polyoxide'
    needs: [version, semver, build-cli, build-python, build-python-sdist]
    runs-on: ubuntu-latest
    environment: cargo
    # Job-level, so a run that never releases cannot queue in the group and cancel a pending real one.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      # Publishes, in dependency order, only the crate versions crates.io lacks, so a
      # re-run after a partial release picks up where it stopped. cargo reads the
      # token from the environment, so it never appears in a command line.
      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/finish_release.sh

  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml

      - name: Build
        run: cargo build --release --package polyoxide-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../polyoxide-cli-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz polyoxide

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../polyoxide-cli-${{ needs.version.outputs.version }}-${{ matrix.target }}.zip polyoxide.exe

      - uses: actions/upload-artifact@v6
        with:
          name: polyoxide-cli-${{ matrix.target }}
          path: polyoxide-cli-${{ needs.version.outputs.version }}-${{ matrix.target }}.*

  build-python:
    name: Build Python (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          # TODO: aarch64-unknown-linux-gnu disabled — aws-lc-sys cross-compilation fails
          # - os: ubuntu-latest
          #   target: aarch64-unknown-linux-gnu
          #   manylinux: auto
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m polyoxide-py/Cargo.toml
          manylinux: ${{ matrix.manylinux || 'auto' }}
          sccache: true

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  build-python-sdist:
    name: Build Python sdist
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m polyoxide-py/Cargo.toml

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  publish-python:
    name: Publish to PyPI
    needs: [version, semver, build-python, build-python-sdist]
    if: |
      needs.version.outputs.should_release == 'true' &&
      github.repository == 'dilettante-trading/polyoxide'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*

  release:
    name: Create Release
    needs: [version, publish, build-cli, publish-python]
    if: |
      needs.version.outputs.should_release == 'true' &&
      github.repository == 'dilettante-trading/polyoxide'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      # Asked again here rather than taken from the version job, because re-running
      # only this job reuses that job's outputs from before the tag was pushed.
      - name: Create git tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          TAG_SHA=$(python3 scripts/publish_order.py tag-sha "$VERSION")
          if [ "$TAG_SHA" = "$SHA" ]; then
            echo "v$VERSION already points at $SHA, so this run is resuming; not tagging again"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      - uses: actions/download-artifact@v7
        with:
          pattern: polyoxide-cli-*
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: artifacts/*
          body: ${{ steps.changelog.outputs.content }}
