name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # The S2 start tag: the removal gate and the test-body diff both compare with it.
  S2_BASELINE: v0.39.0
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.14.0"
      - uses: taiki-e/install-action@nextest
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo nextest run --all-features --workspace
      - run: cargo test --doc --all-features --workspace
      # Doctests run the code in doc comments; they say nothing about whether
      # the prose links resolve. Broken intra-doc links reach docs.rs silently
      # unless rustdoc itself is run with warnings denied.
      - run: cargo doc --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  # Manifest faults (a dependency without a version, a regular path-only
  # dependency, missing metadata) fail here, on the PR that introduces them,
  # instead of halfway through a release. The dry run packages every member
  # whose `publish` is not false. With `--no-verify` it never compiles, so it
  # does not prove each `.crate` builds on its own: a file the package leaves
  # out (a gitignored file, an `include_str!` outside the crate) goes unseen.
  # The other jobs build every crate from the repository instead.
  package:
    name: Package (publish dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Nothing here compiles; say so rather than inherit the sccache wrapper.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # cargo only warns when a manifest lacks a description or a licence, and
      # crates.io then refuses the upload. Offline and quick, so it runs first.
      - run: python3 scripts/publish_order.py check-manifests
      # Runs even when the check above failed, so a PR sees both kinds of fault at once.
      - if: ${{ !cancelled() }}
        run: cargo publish --workspace --dry-run --no-verify --locked

  # The MSRV the manifests declare. Warnings are allowed here, since lints
  # change between releases; the deny-warnings doc gate stays on stable (AD-22).
  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.14.0"
      - run: cargo check --workspace --all-features
      - run: cargo doc --no-deps --workspace --all-features

  # Each feature of each publishable crate on its own, so a module that compiles
  # only because another feature, or a dev-dependency, switched something on
  # fails here (AD-22). `--no-dev-deps` rewrites every manifest while it runs and
  # restores them after, so nothing else may edit a manifest meanwhile.
  features:
    name: Each feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.14.0"
      - run: cargo hack check --workspace --each-feature --no-dev-deps --ignore-private
      # Each HTTP module's header pin in that crate's minimal build, one `-p`
      # per command, since several at once would unify their features; a
      # module of a venue crate turns on its own feature alone. The lint & test
      # job runs the same files in the workspace build, and both must match one
      # literal header set (AD-18).
      - name: Header pins, minimal builds
        run: |
          cargo test -p polyoxide-polymarket --no-default-features --features gamma --test headers_gamma
          cargo test -p polyoxide-polymarket --no-default-features --features data --test headers_data
          cargo test -p polyoxide-perps --no-default-features --test headers
          cargo test -p polyoxide-clob --no-default-features --test headers
          cargo test -p polyoxide-relay --no-default-features --test headers
          cargo test -p polyoxide-binance --no-default-features --test headers

  # Through stage S2 the gate reports and fails nothing on a path that moved or
  # went (AD-22): it lists every public path at the S2 start tag and at this
  # commit from rustdoc JSON, resolves each one gone through
  # docs/rename-manifest.md's rows, and warns of what is left. Story 5.12 runs it
  # with `--strict`. The doc-hidden paths the manifest lists must still compile.
  # cargo-semver-checks runs too, for the changes made in place.
  removals:
    name: Removal gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # Every tag, so the baseline is in the checkout for git archive and
          # cargo-semver-checks to extract.
          fetch-depth: 0
      # cargo-semver-checks 0.51.0 reads rustdoc JSON v57, v60 and v61, which only
      # Rust 1.93 to 1.99 emit. The tool and the toolchain are pinned together and
      # upgraded together, here and in release.yml. scripts/public_api.py reads
      # the same three formats.
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0
      # The baseline's rustdoc builds stay valid until the baseline, the toolchain
      # or the tool changes, and building them cold takes about eight minutes. Only
      # the baseline's tree is cached; the current crates' builds change with every
      # pull request and would double the entry.
      - uses: actions/cache@v4
        with:
          path: target/semver-checks/git-*
          key: semver-checks-${{ env.S2_BASELINE }}-rust-1.99.0-cargo-semver-checks-0.51.0
      # The baseline's extracted tree and its rustdoc JSON for the path diff. The
      # JSON's stamp names the tree, the toolchain and the rustdoc command, so a
      # stale entry is rebuilt; the key names the script that builds and reads it.
      - uses: actions/cache@v4
        with:
          path: target/api-removals/baseline
          key: api-removals-baseline-${{ env.S2_BASELINE }}-rust-1.99.0-${{ hashFiles('scripts/public_api.py') }}
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.14.0"
      - run: python3 scripts/api_removals.py manifest --baseline "$S2_BASELINE" --expand target/rename-map.tsv
      # The manifest with its regions regenerated, which the hub copies in, and
      # every entry with where it went.
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rename-manifest
          path: |
            target/api-removals/rename-manifest.md
            target/rename-map.tsv
          if-no-files-found: warn

  # Every test at the S2 start tag keeps its body at this commit (AD-12, NFR7):
  # each test-context item, with the gates over it, each test target's stanza
  # and each fixture file is paired with its counterpart and normalised through
  # the manifest's rows and ci/test-body-diff.toml, and a diff or a lost item
  # fails unless that file acknowledges it.
  test-bodies:
    name: Test bodies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Nothing here compiles.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v5
        with:
          # Every tag, for the baseline.
          fetch-depth: 0
      - run: python3 scripts/test_body_diff.py --baseline "$S2_BASELINE"

  python:
    name: Python Bindings
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.14.0"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
        working-directory: polyoxide-py
      - run: uv run pytest tests/ -v
        working-directory: polyoxide-py

  scripts:
    name: CI Scripts
    runs-on: ubuntu-latest
    env:
      # `cargo tree --target` (test_dep_allowlists.py) asks rustc for its
      # version through the wrapper, and this job installs no sccache.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v5
        with:
          # Every tag: the venue gate's test reads v0.39.0's core, which it must catch.
          fetch-depth: 0
      # scripts/publish_order.py, which the tests load, reads the workspace through cargo metadata.
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
        working-directory: .github/scripts
      - run: uv run pytest tests/ -v
        working-directory: .github/scripts
