name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.14.0"
      - uses: taiki-e/install-action@nextest
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo nextest run --all-features --workspace
      - run: cargo test --doc --all-features --workspace
      # Doctests run the code in doc comments; they say nothing about whether
      # the prose links resolve. Broken intra-doc links reach docs.rs silently
      # unless rustdoc itself is run with warnings denied.
      - run: cargo doc --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    name: Python Bindings
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.14.0"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
        working-directory: polyoxide-py
      - run: uv run pytest tests/ -v
        working-directory: polyoxide-py

  scripts:
    name: CI Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
        working-directory: .github/scripts
      - run: uv run pytest tests/ -v
        working-directory: .github/scripts
