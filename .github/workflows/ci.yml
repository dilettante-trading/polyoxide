name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.14.0"
      - uses: taiki-e/install-action@nextest
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo nextest run --all-features --workspace
      - run: cargo test --doc --all-features --workspace
      # Doctests run the code in doc comments; they say nothing about whether
      # the prose links resolve. Broken intra-doc links reach docs.rs silently
      # unless rustdoc itself is run with warnings denied.
      - run: cargo doc --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  # Manifest faults (a dependency without a version, a regular path-only
  # dependency, missing metadata) fail here, on the PR that introduces them,
  # instead of halfway through a release. The dry run packages every member
  # whose `publish` is not false. With `--no-verify` it never compiles, so it
  # does not prove each `.crate` builds on its own: a file the package leaves
  # out (a gitignored file, an `include_str!` outside the crate) goes unseen.
  # The other jobs build every crate from the repository instead.
  package:
    name: Package (publish dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Nothing here compiles; say so rather than inherit the sccache wrapper.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # cargo only warns when a manifest lacks a description or a licence, and
      # crates.io then refuses the upload. Offline and quick, so it runs first.
      - run: python3 scripts/publish_order.py check-manifests
      # Runs even when the check above failed, so a PR sees both kinds of fault at once.
      - if: ${{ !cancelled() }}
        run: cargo publish --workspace --dry-run --no-verify --locked

  python:
    name: Python Bindings
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.14.0"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
        working-directory: polyoxide-py
      - run: uv run pytest tests/ -v
        working-directory: polyoxide-py

  scripts:
    name: CI Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # scripts/publish_order.py, which the tests load, reads the workspace through cargo metadata.
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
        working-directory: .github/scripts
      - run: uv run pytest tests/ -v
        working-directory: .github/scripts
