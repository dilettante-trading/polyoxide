name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # The S3 start tag, the S2 release: the removal gate and the test-body diff both
  # compare with it.
  S3_BASELINE: v0.40.0
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.14.0"
      - uses: taiki-e/install-action@nextest
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo nextest run --all-features --workspace
      - run: cargo test --doc --all-features --workspace
      # Doctests run the code in doc comments; they say nothing about whether
      # the prose links resolve. Broken intra-doc links reach docs.rs silently
      # unless rustdoc itself is run with warnings denied.
      - run: cargo doc --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  # Manifest faults (a dependency without a version, a regular path-only
  # dependency, missing metadata) fail here, on the PR that introduces them,
  # instead of halfway through a release. The dry run packages every member
  # whose `publish` is not false. With `--no-verify` it never compiles, so it
  # does not prove each `.crate` builds on its own: a file the package leaves
  # out (a gitignored file, an `include_str!` outside the crate) goes unseen.
  # The other jobs build every crate from the repository instead.
  package:
    name: Package (publish dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Nothing here compiles; say so rather than inherit the sccache wrapper.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # cargo only warns when a manifest lacks a description or a licence, and
      # crates.io then refuses the upload. Offline and quick, so it runs first.
      - run: python3 scripts/publish_order.py check-manifests
      # Runs even when the check above failed, so a PR sees both kinds of fault at once.
      - if: ${{ !cancelled() }}
        run: cargo publish --workspace --dry-run --no-verify --locked
      # The tombstones sit outside the workspace, so the dry run above never sees
      # them; each is packaged by its own manifest, as the release publishes it.
      # Without `--no-verify` cargo would also build each one, and a tombstone's
      # `compile_error!` fails every build but docs.rs's. Once the commit after
      # the release deletes tombstones/, the loop finds nothing to package.
      - if: ${{ !cancelled() }}
        run: |
          for manifest in tombstones/*/Cargo.toml; do
            [ -e "$manifest" ] || continue
            cargo package --no-verify --manifest-path "$manifest" || exit 1
          done

  # The MSRV the manifests declare. Warnings are allowed here, since lints
  # change between releases; the deny-warnings doc gate stays on stable (AD-22).
  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.14.0"
      - run: cargo check --workspace --all-features
      - run: cargo doc --no-deps --workspace --all-features

  # Each feature of each publishable crate on its own, so a module that compiles
  # only because another feature, or a dev-dependency, switched something on
  # fails here (AD-22). `--no-dev-deps` rewrites every manifest while it runs and
  # restores them after, so nothing else may edit a manifest meanwhile.
  features:
    name: Each feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.14.0"
      - run: cargo hack check --workspace --each-feature --no-dev-deps --ignore-private
      # Each HTTP module's header pin in that crate's minimal build, one `-p`
      # per command, since several at once would unify their features; a
      # module of a venue crate turns on its own feature alone. The lint & test
      # job runs the same files in the workspace build, and both must match one
      # literal header set (AD-18).
      - name: Header pins, minimal builds
        run: |
          cargo test -p polyoxide-polymarket --no-default-features --features clob --test headers_clob
          cargo test -p polyoxide-polymarket --no-default-features --features gamma --test headers_gamma
          cargo test -p polyoxide-polymarket --no-default-features --features data --test headers_data
          cargo test -p polyoxide-polymarket --no-default-features --features relay --test headers_relay
          cargo test -p polyoxide-polymarket --no-default-features --features perps --test headers_perps
          cargo test -p polyoxide-binance --no-default-features --features usdm --test headers_usdm
          cargo test -p polyoxide-kalshi --no-default-features --features predictions --test headers_predictions
      # The same pins with the umbrella's `full` beside each venue crate, so
      # every feature any venue's module turns on is unified into the pinned
      # build, and a header one venue adds through the umbrella fails another's
      # literal (AD-18's third build). `polyoxide-kalshi` is published and the
      # umbrella includes it, so its pin runs beside `polyoxide/full` like the
      # others, and `full` turns on `kalshi`, `kalshi-predictions` and
      # `kalshi-predictions-ws` in the pinned build.
      - name: Header pins, umbrella full build
        run: |
          cargo test -p polyoxide -p polyoxide-polymarket --features polyoxide/full --test headers_clob
          cargo test -p polyoxide -p polyoxide-polymarket --features polyoxide/full --test headers_gamma
          cargo test -p polyoxide -p polyoxide-polymarket --features polyoxide/full --test headers_data
          cargo test -p polyoxide -p polyoxide-polymarket --features polyoxide/full --test headers_relay
          cargo test -p polyoxide -p polyoxide-polymarket --features polyoxide/full --test headers_perps
          cargo test -p polyoxide -p polyoxide-binance --features polyoxide/full --test headers_usdm
          cargo test -p polyoxide -p polyoxide-kalshi --features polyoxide/full --test headers_predictions
      # Each module of a venue crate with `specta`, whose extras for that module
      # (`specta?/chrono`, `specta?/rust_decimal`) are weak features: neither
      # `--each-feature`, which builds `specta` alone, nor `--all-features`,
      # which turns on every extra at once, sees a module that lacks its own.
      # `clob` does not imply `gamma`, so a proxy order with no funder is refused
      # instead of looked up; only a build without `gamma` compiles that arm.
      - name: clob without gamma
        run: cargo test -p polyoxide-polymarket --no-default-features --features clob --test mock_clob -- a_proxy_order_with_no_funder_is_refused_without_gamma --exact
      # The same holds for the trading tests: three of `trading_clob`'s refuse a
      # proxy client's order, positions and stream when `gamma` is off, and they
      # are compiled only without it.
      - name: clob trading without gamma
        run: cargo test -p polyoxide-polymarket --no-default-features --features clob-ws,data --test trading_clob
      - name: Each module with specta
        run: |
          cargo check -p polyoxide-polymarket --no-default-features --features clob,specta
          cargo check -p polyoxide-polymarket --no-default-features --features gamma,specta
          cargo check -p polyoxide-polymarket --no-default-features --features data,specta
          cargo check -p polyoxide-polymarket --no-default-features --features relay,specta
          cargo check -p polyoxide-polymarket --no-default-features --features perps,specta

  # From stage S3 the gate is cargo-semver-checks against the S3 start tag: it
  # fails on any removal docs/s3-removals.md does not list, and the doc-hidden
  # paths that file lists must still compile (AD-22).
  removals:
    name: Removal gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # Every tag, so the baseline is in the checkout for cargo-semver-checks
          # to extract.
          fetch-depth: 0
      # cargo-semver-checks 0.51.0 reads rustdoc JSON v57, v60 and v61, which only
      # Rust 1.93 to 1.99 emit. The tool and the toolchain are pinned together and
      # upgraded together, here and in release.yml.
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0
      # The baseline's rustdoc builds stay valid until the baseline, the toolchain
      # or the tool changes, and building them cold takes about eight minutes. Only
      # the baseline's tree is cached; the current crates' builds change with every
      # pull request and would double the entry.
      - uses: actions/cache@v4
        with:
          path: target/semver-checks/git-*
          key: semver-checks-${{ env.S3_BASELINE }}-rust-1.99.0-cargo-semver-checks-0.51.0
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.14.0"
      - run: python3 scripts/api_removals.py check --baseline "$S3_BASELINE"

  # Every test at the S3 start tag keeps its body at this commit (AD-12, NFR7):
  # each test-context item, with the gates over it, each test target's stanza
  # and each fixture file is paired with its counterpart and normalised through
  # the manifest's rows and ci/test-body-diff.toml, and a diff or a lost item
  # fails unless that file acknowledges it.
  test-bodies:
    name: Test bodies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Nothing here compiles.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v5
        with:
          # Every tag, for the baseline.
          fetch-depth: 0
      - run: python3 scripts/test_body_diff.py --baseline "$S3_BASELINE"

  python:
    name: Python Bindings
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.14.0"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
        working-directory: polyoxide-py
      - run: uv run pytest tests/ -v
        working-directory: polyoxide-py

  scripts:
    name: CI Scripts
    runs-on: ubuntu-latest
    env:
      # `cargo tree --target` (test_dep_allowlists.py) asks rustc for its
      # version through the wrapper, and this job installs no sccache.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v5
        with:
          # Every tag: the venue gate's test reads v0.39.0's core, which it must catch.
          fetch-depth: 0
      # scripts/publish_order.py, which the tests load, reads the workspace through cargo metadata.
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
        working-directory: .github/scripts
      - run: uv run pytest tests/ -v
        working-directory: .github/scripts
