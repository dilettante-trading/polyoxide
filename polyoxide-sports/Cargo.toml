[package]
name = "polyoxide-sports"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust client for Polymarket's live sports score WebSocket"
keywords = ["polymarket", "websocket", "sports", "scores"]
categories = ["api-bindings", "web-programming::websocket"]

[features]
# Exposes the captured frames, so integration tests here and in polyoxide-cli
# can use them. Not for consumers; the module is `#[doc(hidden)]`. The name
# is kept from when it also exposed a scripted server, which is now the
# kit's (`polyoxide_ws::test_server`).
test-server = []

# These import `fixtures`, which exists only behind the feature.
# `required-features` makes a plain `cargo test --all-targets` skip them
# instead of failing to build them.
[[test]]
name = "bare"
required-features = ["test-server"]

[[test]]
name = "supervision"
required-features = ["test-server"]

[dependencies]
polyoxide-venue = { workspace = true }
# The socket kit: connect with a timeout and the TLS install, the bare tier
# both tiers read through, `Backoff`, `WsError` and `retrying_can_fix`. It owns
# the transport, so sports declares no tokio-tungstenite.
polyoxide-ws = { workspace = true }
tokio = { workspace = true, features = ["time"] }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The live suites' failure tags and credential loaders. Path-only: it is never
# published, and cargo strips a path-only dev-dependency on publish.
polyoxide-test-support = { path = "../polyoxide-test-support" }
# The shared scripted WebSocket server the offline suites run on. Path-only,
# so cargo strips it on publish.
polyoxide-ws = { path = "../polyoxide-ws", features = ["test-server"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }

# Registration, read by scripts/gen_registry.py: the README line, venue and
# product ids, the docs/specs/ mirrors covered, and one entry per live test
# target, which becomes a nightly job. Run `python3 scripts/gen_registry.py
# --write` after an edit.
[package.metadata.polyoxide]
readme = "Client for Polymarket's live sports score feed"
venue = "polymarket"
products = ["sports"]
mirrors = ["sports"]
notes = ["no `polyoxide-core`, `reqwest` or `alloy`, like `polyoxide-rtds`"]

[package.metadata.polyoxide.live.live_api]
suite = "live"
timeout = 20
features = []
secrets = []
note = "20-minute budget for its 180 s wire-agreement window"
