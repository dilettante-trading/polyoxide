[package]
name = "polyoxide-binance"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust client library for Binance USDⓈ-M futures market data and streams"
keywords = ["binance", "futures", "perpetuals", "market-data"]
categories = ["api-bindings", "web-programming::http-client"]

# One feature per module (Story 5.6), as polyoxide-polymarket has: `usdm`, the
# USDⓈ-M futures REST client and its weight budget, and `usdm-ws`, its market
# streams, which turns `usdm` on.
[features]
default = ["usdm"]
usdm = [
    "dep:polyoxide-core",
    "polyoxide-venue/decimal",
    "polyoxide-venue/market",
    "dep:rust_decimal",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
    "dep:url",
]
# The USDⓈ-M market streams, `usdm::ws`, on the socket kit.
usdm-ws = ["usdm", "dep:polyoxide-ws", "dep:futures-util", "tokio/rt", "tokio/macros"]
# Exposes the captured frames, `usdm::ws::fixtures`, for downstream tests, with
# `usdm-ws`; it turns no module on. Not for consumers.
test-server = []

[dependencies]
polyoxide-core = { workspace = true, optional = true }
polyoxide-venue = { workspace = true }
# The socket kit (`usdm-ws`): connect, the bare tier, the socket error and the
# supervisor. It owns the transport, tokio-tungstenite and rustls.
polyoxide-ws = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time", "sync"], optional = true }
futures-util = { version = "0.3", optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
# The live suites' failure tags and credential loaders. Path-only: it is never
# published, and cargo strips a path-only dev-dependency on publish.
polyoxide-test-support = { path = "../polyoxide-test-support", features = ["query"] }
# The shared scripted WebSocket server the `usdm-ws` suites run on, with
# Binance's answer (`src/usdm/ws/scripted.rs`). Path-only, so cargo strips it on
# publish.
polyoxide-ws = { path = "../polyoxide-ws", features = ["test-server"] }
futures-util = "0.3"
mockito = { workspace = true }
# `test-util` gives the limiter tests a paused clock, so a minute's wait is
# asserted without actually waiting a minute.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
# The ban log's test reads the 418's warning.
tracing-subscriber = { workspace = true }

# `cargo test` builds examples but does not run their unit tests unless
# asked; the checks that the probe measures the routes it names live here.
[[example]]
name = "weight_probe"
path = "examples/weight_probe.rs"
test = true
required-features = ["usdm"]

# The usdm module's suites (Story 5.6). The socket suites import the captured
# frames, which only `test-server` exposes outside the unit tests;
# `required-features` keeps a plain `cargo test --all-targets` from building
# them without it.
[[test]]
name = "ban_log_usdm"
required-features = ["usdm"]

[[test]]
name = "error_classes_usdm"
required-features = ["usdm"]

[[test]]
name = "failure_tags_usdm"
required-features = ["usdm"]

[[test]]
name = "headers_usdm"
required-features = ["usdm"]

[[test]]
name = "live_usdm"
required-features = ["usdm"]

[[test]]
name = "live_usdm_ws"
required-features = ["usdm-ws"]

[[test]]
name = "mock_usdm"
required-features = ["usdm"]

[[test]]
name = "query_setters_usdm"
required-features = ["usdm"]

[[test]]
name = "supervision_usdm"
required-features = ["usdm-ws", "test-server"]

[[test]]
name = "supervision_usdm_edges"
required-features = ["usdm-ws", "test-server"]

[[test]]
name = "supervision_usdm_kit"
required-features = ["usdm-ws", "test-server"]

[[test]]
name = "venue_usdm"
required-features = ["usdm"]

[[test]]
name = "wire_agreement_usdm"
required-features = ["usdm"]

[[test]]
name = "wire_agreement_usdm_ws"
required-features = ["usdm-ws", "test-server"]

# docs.rs documents the module and its streams; `test-server` stays out of the
# docs.
[package.metadata.docs.rs]
features = ["usdm", "usdm-ws"]

# Registration, read by scripts/gen_registry.py: the README line, venue and
# product ids, the docs/specs/ mirrors covered, one entry per live test target,
# which becomes a nightly job, and the identifiers the venue gate looks for in
# the foundation crates and the exceptions it allows there. Run
# `python3 scripts/gen_registry.py --write` after an edit.
[package.metadata.polyoxide]
readme = "Client library for Binance's APIs, one feature per module: `usdm` (USDⓈ-M futures market data, with its streams under `usdm-ws`); re-exported by the umbrella as `polyoxide::binance`"
venue = "binance"
products = ["usdm"]
classes = { usdm = "perpetual-future" }
mirrors = ["binance"]
identifiers = ["fapi", "fstream", "X-MBX"]

[package.metadata.polyoxide.live.live_usdm]
suite = "usdm"
timeout = 15
features = ["usdm"]
secrets = []

[package.metadata.polyoxide.live.live_usdm_ws]
suite = "usdm"
timeout = 15
features = ["usdm-ws"]
secrets = []

# The foundation crates' protected test names that still name Binance (S2 may
# not rename a test, AD-12).
[[package.metadata.polyoxide.gate_exceptions]]
path = "polyoxide-ws/src/request.rs"
term = "binance"
reason = "the request-correlation tests of Story 4.2 model Binance's answers in `mod binance`, and four of their protected names start `binance_`"

[[package.metadata.polyoxide.gate_exceptions]]
path = "polyoxide-ws/src/test_server/tests.rs"
term = "binance"
reason = "the scripted server's protected tests of Story 4.4 answer as Binance does, in `mod as_binance_will_use_it` and `subscribe_list_and_unsubscribe_answer_as_binance_does`"
