[package]
name = "polyoxide-binance"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust client library for Binance USDⓈ-M futures market data and streams"
keywords = ["binance", "futures", "perpetuals", "market-data"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = []
# The USDⓈ-M market streams.
ws = ["dep:tokio-tungstenite", "dep:futures-util", "dep:rustls", "tokio/net", "tokio/rt", "tokio/macros"]
# Exposes the scripted local server and the captured frames for downstream
# tests. Not for consumers.
test-server = ["ws"]

[dependencies]
polyoxide-core = { workspace = true }
polyoxide-venue = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }
# Needed only to install a process-default rustls CryptoProvider; see
# `ensure_crypto_provider` in src/usdm/ws/mod.rs.
rustls = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The live suites' failure tags and credential loaders. Path-only: it is never
# published, and cargo strips a path-only dev-dependency on publish.
polyoxide-test-support = { path = "../polyoxide-test-support" }
futures-util = "0.3"
mockito = { workspace = true }
# `test-util` gives the limiter tests a paused clock, so a minute's wait is
# asserted without actually waiting a minute.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
# The ban log's test reads the 418's warning.
tracing-subscriber = { workspace = true }

# `cargo test` builds examples but does not run their unit tests unless
# asked; the checks that the probe measures the routes it names live here.
[[example]]
name = "weight_probe"
path = "examples/weight_probe.rs"
test = true

# The socket tests import items that exist only behind their feature;
# `required-features` keeps a plain `cargo test --all-targets` from building
# them without it.
[[test]]
name = "ws_wire_agreement"
required-features = ["test-server"]

[[test]]
name = "supervision"
required-features = ["test-server"]

[[test]]
name = "supervision_edges"
required-features = ["test-server"]

[[test]]
name = "live_ws"
required-features = ["ws"]

# docs.rs documents the streams too; `test-server` stays out of the docs.
[package.metadata.docs.rs]
features = ["ws"]

# Registration, read by scripts/gen_registry.py: the README line, venue and
# product ids, the docs/specs/ mirrors covered, and one entry per live test
# target, which becomes a nightly job. Run `python3 scripts/gen_registry.py
# --write` after an edit.
[package.metadata.polyoxide]
readme = "Client library for Binance USDⓈ-M futures market data and streams (not part of the unified crate)"
venue = "binance"
products = ["usdm"]
mirrors = ["binance"]

[package.metadata.polyoxide.live.live_api]
suite = "live"
timeout = 15
features = []
secrets = []

[package.metadata.polyoxide.live.live_ws]
suite = "live"
timeout = 15
features = ["ws"]
secrets = []
