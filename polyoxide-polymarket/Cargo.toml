[package]
name = "polyoxide-polymarket"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust client library for Polymarket's APIs: CLOB, Gamma, Data, Relay and Perps, each behind its own feature"
keywords = ["polymarket", "prediction-markets", "trading", "api"]
categories = ["api-bindings", "web-programming::http-client"]

# One feature per module. `clob`, `gamma`, `data` and `relay` build their
# modules (Stories 5.3 and 5.4); `perps` arrives in Story 5.5, and today turns
# on the parts of `shared` its crate uses. The HTTP modules share the retry
# policy and their window-quota table, and clob and relay share the HMAC signer
# and the session-signer types. Only `clob` and `relay` build `alloy`, the
# signing stack: `.github/scripts/tests/test_dep_allowlists.py` holds every
# other feature to a tree without it.
[features]
default = ["clob", "gamma", "data"]
clob = [
    "dep:polyoxide-core",
    "dep:base64",
    "dep:hmac",
    "dep:sha2",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tracing",
    "dep:url",
    "dep:alloy",
    "dep:hex",
    "dep:rand",
    "dep:rust_decimal",
    "dep:tokio",
    "tokio/time",
    "dep:urlencoding",
]
# The CLOB's two WebSocket channels, `clob::ws`.
clob-ws = [
    "clob",
    "dep:polyoxide-ws",
    "dep:futures-util",
    "tokio/net",
    "tokio/macros",
    "tokio/sync",
]
gamma = [
    "dep:polyoxide-core",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:url",
    "dep:chrono",
    "dep:tokio",
    "tokio/macros",
    "dep:urlencoding",
    "specta?/chrono",
]
data = [
    "dep:polyoxide-core",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:url",
    "dep:futures-util",
    "dep:rust_decimal",
    "specta?/rust_decimal",
]
# The relay adds the chain RPC its gas estimation calls through alloy.
relay = [
    "dep:polyoxide-core",
    "dep:base64",
    "dep:hmac",
    "dep:sha2",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tracing",
    "dep:url",
    "dep:alloy",
    "alloy?/provider-http",
    "alloy?/rpc-types",
    "dep:hex",
    "dep:rand",
    "dep:tokio",
    "tokio/time",
]
perps = ["dep:polyoxide-core"]
# OS keychain storage for credentials. Its API is in `clob` and `relay`
# (`clob::save_private_key_to_keychain`, `relay::save_builder_config_to_keychain`
# and their `from_keychain` loaders), but cargo cannot say "only with clob or
# relay": it builds core's `keyring` whenever any module that uses core is on,
# `gamma` or `data` alone included.
keychain = ["polyoxide-core?/keychain"]
# Derives `specta::Type` on gamma's and data's response types; clob and relay
# derive none. Each of the two adds the specta extras its types need: `chrono`
# for gamma's dates, and `rust_decimal` for data's decimals, which are strings
# on the wire.
specta = ["dep:specta"]

[dependencies]
polyoxide-core = { workspace = true, optional = true }
polyoxide-venue = { workspace = true }
# EIP-712 signing and the chain types (`clob`, `relay`); the relay adds the
# chain RPC its gas estimation calls.
alloy = { version = "1.1.2", features = [
    "network",
    "signer-local",
    "signers",
    "sol-types",
], optional = true }
# The CLOB's socket kit (`clob-ws`): the TLS install, the bare tier clob reads
# through, the upgrade over its own per-address connect, and `WsError`. It owns
# the transport, so this crate declares neither tokio-tungstenite nor rustls.
polyoxide-ws = { workspace = true, optional = true }
# The HMAC `Signer` (`clob`, `relay`).
base64 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# The session-signer types' wire form and the modules' types.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# The signer layer's refusal and its tier log line (`clob`), and the modules'
# errors and logs.
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
# Gamma's dates (`gamma`); its batch fan-out, and the timers of clob and
# relay (`gamma`, `clob`, `relay`); path segments (`gamma`, `clob`).
chrono = { workspace = true, features = ["serde"], optional = true }
tokio = { workspace = true, optional = true }
urlencoding = { version = "2.1", optional = true }
# Data's v2 page streams and the CLOB's socket (`data`, `clob-ws`); the
# decimals of data and clob (`data`, `clob`).
futures-util = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
# Addresses and salts of clob and relay (`clob`, `relay`).
hex = { workspace = true, optional = true }
rand = { version = "0.9.2", features = ["std"], optional = true }
specta = { version = "=2.0.0-rc.20", features = ["derive", "serde"], optional = true }

[dev-dependencies]
# The live suites' failure tags and credential loaders, and the agreement and
# soak helpers (`query` fires a builder at a mock server; `soak` is the
# harnesses' pacer, observer and verdicts). Path-only: it is never published,
# and cargo strips a path-only dev-dependency on publish.
polyoxide-test-support = { path = "../polyoxide-test-support", features = ["query", "soak"] }
# The shared scripted WebSocket server clob's offline socket suites run on.
# Path-only, so cargo strips it on publish.
polyoxide-ws = { path = "../polyoxide-ws", features = ["test-server"] }
mockito = { workspace = true }
serde_json = { workspace = true }
dotenvy = "0.15"
futures-util = { workspace = true }
rust_decimal_macros = "1.37"
# `test-util` gives the cooldown tests a paused clock, so they assert the full
# backoff without actually sleeping for it.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
# The send loop's tests read its warnings.
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Each suite drives the parts of `shared` its features build.
[[test]]
name = "polymarket_limits"
required-features = ["clob", "gamma", "data", "relay", "perps"]

[[test]]
name = "polymarket_throttle"
required-features = ["clob"]

[[test]]
name = "send_loop"
required-features = ["gamma"]

[[test]]
name = "health"
required-features = ["gamma"]

# The gamma module's suites (Story 5.3).
[[test]]
name = "error_classes_gamma"
required-features = ["gamma"]

[[test]]
name = "headers_gamma"
required-features = ["gamma"]

[[test]]
name = "live_gamma"
required-features = ["gamma"]

[[test]]
name = "mock_gamma"
required-features = ["gamma"]

[[test]]
name = "query_setters_gamma"
required-features = ["gamma"]

[[test]]
name = "wire_agreement_gamma"
required-features = ["gamma"]

# The data module's suites (Story 5.3); `tests/common/` is their shared mock
# server helper.
[[test]]
name = "enum_wire_data_v2"
required-features = ["data"]

[[test]]
name = "error_classes_data"
required-features = ["data"]

[[test]]
name = "headers_data"
required-features = ["data"]

[[test]]
name = "holders_shape_data"
required-features = ["data"]

[[test]]
name = "live_data"
required-features = ["data"]

[[test]]
name = "mock_data"
required-features = ["data"]

[[test]]
name = "mock_data_v2"
required-features = ["data"]

[[test]]
name = "query_setters_data"
required-features = ["data"]

[[test]]
name = "spec_agreement_data_v2"
required-features = ["data"]

[[test]]
name = "wire_agreement_data_v2"
required-features = ["data"]

# The clob module's suites (Story 5.4). `live_clob` looks markets up through
# gamma, and `live_clob_session_keys` also deploys through relay.
[[test]]
name = "error_classes_clob"
required-features = ["clob"]

[[test]]
name = "headers_clob"
required-features = ["clob"]

[[test]]
name = "live_clob"
required-features = ["clob", "gamma"]

[[test]]
name = "live_clob_session_keys"
required-features = ["clob", "relay", "gamma"]

# `live_clob_ws.rs` is `#![cfg(feature = "clob-ws")]`. Without this stanza a
# build without the feature compiles it to an empty binary that runs no tests.
[[test]]
name = "live_clob_ws"
required-features = ["clob-ws"]

[[test]]
name = "mock_clob"
required-features = ["clob"]

[[test]]
name = "query_setters_clob"
required-features = ["clob"]

# The relay module's suites (Story 5.4).
[[test]]
name = "error_classes_relay"
required-features = ["relay"]

[[test]]
name = "headers_relay"
required-features = ["relay"]

[[test]]
name = "live_relay"
required-features = ["relay"]

[[test]]
name = "mock_relay"
required-features = ["relay"]

# Gamma's probes of Cloudflare's burst limit and its batch ceiling.
[[example]]
name = "cf_burst_probe"
required-features = ["gamma"]

[[example]]
name = "gamma_batch_ceiling"
required-features = ["gamma"]

# The clob module's order placement and its two channels, and the relay's
# nonce lookup and redemption.
# `test_order` signs a proxy order with no funder, which only the Gamma lookup
# resolves.
[[example]]
name = "test_order"
required-features = ["clob", "gamma"]

[[example]]
name = "ws_market"
required-features = ["clob-ws"]

[[example]]
name = "ws_user"
required-features = ["clob-ws"]

[[example]]
name = "get_nonce"
required-features = ["relay"]

[[example]]
name = "redeem"
required-features = ["relay"]

# `cargo test` and `cargo nextest` build examples but do not run their unit
# tests unless asked, so the rate-limit harnesses' tests would otherwise never
# run in CI. The verdict rules that pinned `shared::data_limits`'s v2
# rows are polyoxide-test-support's `soak::verdict::tolerant`, tested there.
[[example]]
name = "v2_soak"
path = "examples/v2_soak/main.rs"
test = true
required-features = ["data"]

[[example]]
name = "closed_positions_soak"
path = "examples/closed_positions_soak.rs"
test = true
required-features = ["data"]

[[example]]
name = "closed_positions_burst_probe"
path = "examples/closed_positions_burst_probe.rs"
test = true
required-features = ["data"]

[package.metadata.docs.rs]
all-features = true

# Registration, read by scripts/gen_registry.py: the README line, the venue
# and product ids, the docs/specs/ mirrors covered, one entry per live test
# target, which becomes a nightly job, the identifiers the venue gate looks for
# in the foundation crates and the exceptions it allows there. Run
# `python3 scripts/gen_registry.py --write` after an edit.
[package.metadata.polyoxide]
readme = "Client library for Polymarket's APIs, one feature per module: `clob` (order book, with its sockets under `clob-ws`), `gamma` (market data), `data` (user data, v1 and v2) and `relay` (gasless transactions), with the code the modules share in `shared`; perps, rtds and sports arrive in Story 5.5"
venue = "polymarket"
products = ["clob", "gamma", "data", "relay"]
mirrors = ["clob", "gamma", "data", "data-v2", "undocumented", "relay", "session-keys"]
identifiers = ["Poly-RateLimit"]
notes = ["only `clob` and `relay` build `alloy`, which `test_dep_allowlists.py` holds per feature; `clob` does not turn on `gamma`, and with both the CLOB client looks a proxy wallet up through Gamma"]

[package.metadata.polyoxide.live.live_clob]
suite = "clob"
timeout = 15
features = ["clob", "gamma"]
secrets = [
  "POLYMARKET_API_KEY",
  "POLYMARKET_API_PASSPHRASE",
  "POLYMARKET_API_SECRET",
  "POLYMARKET_BUILDER_CODE",
  "POLYMARKET_PRIVATE_KEY",
]

[package.metadata.polyoxide.live.live_clob_ws]
suite = "clob"
timeout = 15
features = ["clob-ws"]
secrets = ["POLYMARKET_PRIVATE_KEY"]

[package.metadata.polyoxide.live.live_clob_session_keys]
suite = "clob-session-keys"
timeout = 40
features = ["clob", "relay", "gamma"]
secrets = [
  "BUILDER_API_KEY",
  "BUILDER_PASS_PHRASE",
  "BUILDER_SECRET",
  "POLYMARKET_DW_OWNER_PRIVATE_KEY",
  "POLYMARKET_DW_SESSION_PRIVATE_KEY",
  "POLYMARKET_DW_WALLET",
]
note = "40-minute budget in its own job, since its registry and transaction waits can take ~25 minutes"

[package.metadata.polyoxide.live.live_gamma]
suite = "gamma"
timeout = 15
features = ["gamma"]
secrets = []

[package.metadata.polyoxide.live.live_data]
suite = "data"
timeout = 15
features = ["data"]
secrets = []

[package.metadata.polyoxide.live.live_relay]
suite = "relay"
timeout = 15
features = ["relay"]
secrets = [
  "BUILDER_API_KEY",
  "BUILDER_PASS_PHRASE",
  "BUILDER_SECRET",
  "POLYMARKET_PRIVATE_KEY",
  "RELAYER_API_KEY",
  "RELAYER_API_KEY_ADDRESS",
]

# The foundation crates' protected test names and probe that still name a
# Polymarket product or host (S2 may not rename a test, AD-12).
[[package.metadata.polyoxide.gate_exceptions]]
path = "polyoxide-ws/src/request.rs"
term = "perps"
reason = "the request-correlation tests of Story 4.2 model perps' answers in `mod perps`, and two of their protected names start `perps_`"

[[package.metadata.polyoxide.gate_exceptions]]
path = "polyoxide-ws/src/test_server/tests.rs"
term = "perps"
reason = "the scripted server's protected tests of Story 4.4 answer as perps does, in `mod as_perps_will_use_it` and its `Perps` answerer"

[[package.metadata.polyoxide.gate_exceptions]]
path = "polyoxide-ws/src/test_server/tests.rs"
term = "rtds"
reason = "the scripted server's protected tests of Story 4.4 replay rtds' old suite in `mod as_rtds_used_it`"

[[package.metadata.polyoxide.gate_exceptions]]
path = "polyoxide-ws/examples/close_reply_probe.rs"
term = "perps"
reason = "the probe of DRIFT R3 measured perps' public socket, its default host, `PERPS_WS_URL`"

[[package.metadata.polyoxide.gate_exceptions]]
path = "polyoxide-ws/examples/close_reply_probe.rs"
term = "polymarket"
reason = "the probe of DRIFT R3 defaults to perps' public socket on `ws.perpetuals.polymarket.com`"
