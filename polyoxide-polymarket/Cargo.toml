# Every module and `-ws` feature, `keychain` and `specta`; not `test-server`,
# which exposes captured frames for tests alone.
[package.metadata.docs.rs]
features = [
    "clob",
    "clob-ws",
    "gamma",
    "data",
    "relay",
    "perps",
    "perps-ws",
    "rtds",
    "sports",
    "keychain",
    "specta",
]

# Registration, read by scripts/gen_registry.py: the README line, the venue
# and product ids, the docs/specs/ mirrors covered, one entry per live test
# target, which becomes a nightly job, the identifiers the venue gate looks for
# in the foundation crates and the exceptions it allows there. Run
# `python3 scripts/gen_registry.py --write` after an edit.
[package.metadata.polyoxide]
readme = "Client library for Polymarket's APIs, one feature per module: `clob` (order book, with its sockets under `clob-ws`), `gamma` (market data), `data` (user data, v1 and v2), `relay` (gasless transactions), `perps` (perpetual futures market data, with its sockets under `perps-ws`), `rtds` (crypto price streams) and `sports` (live sports scores), with the code the HTTP modules share in `shared` and, with `clob`, `gamma` and `data`, the unified `Polymarket` client; re-exported by the umbrella as `polyoxide::polymarket`"
venue = "polymarket"
products = ["clob", "gamma", "data", "relay", "perps", "rtds", "sports"]
mirrors = ["clob", "gamma", "data", "data-v2", "undocumented", "relay", "session-keys", "perps", "rtds", "sports"]
identifiers = ["Poly-RateLimit"]
notes = [
  "only `clob` and `relay` build `alloy`, and only the HTTP modules build core, which `test_dep_allowlists.py` holds per feature; `clob` does not turn on `gamma`, and with both the CLOB client looks a proxy wallet up through Gamma",
  "`rtds` and `sports` build no `polyoxide-core`, `reqwest` or `alloy`, so a credential-free feed builds no HTTP or signing stack",
  "`Trading` for the CLOB (`clob::venue`) is built with `clob-ws` and `data` together: its events stream runs on the supervised user socket, which is `clob-ws`'s, and its positions read the Data API",
  "perps' auth and trading pending",
]

[package.metadata.polyoxide.live.live_clob]
suite = "clob"
timeout = 15
features = ["clob", "gamma"]
secrets = [
  "POLYMARKET_API_KEY",
  "POLYMARKET_API_PASSPHRASE",
  "POLYMARKET_API_SECRET",
  "POLYMARKET_BUILDER_CODE",
  "POLYMARKET_PRIVATE_KEY",
]

[package.metadata.polyoxide.live.live_clob_ws]
suite = "clob"
timeout = 15
features = ["clob-ws"]
secrets = ["POLYMARKET_PRIVATE_KEY"]

[package.metadata.polyoxide.live.live_clob_session_keys]
suite = "clob-session-keys"
timeout = 40
features = ["clob", "relay", "gamma"]
secrets = [
  "BUILDER_API_KEY",
  "BUILDER_PASS_PHRASE",
  "BUILDER_SECRET",
  "POLYMARKET_DW_OWNER_PRIVATE_KEY",
  "POLYMARKET_DW_SESSION_PRIVATE_KEY",
  "POLYMARKET_DW_WALLET",
]
note = "40-minute budget in its own job, since its registry and transaction waits can take ~25 minutes"

[package.metadata.polyoxide.live.live_gamma]
suite = "gamma"
timeout = 15
features = ["gamma"]
secrets = []

[package.metadata.polyoxide.live.live_data]
suite = "data"
timeout = 15
features = ["data"]
secrets = []

[package.metadata.polyoxide.live.live_relay]
suite = "relay"
timeout = 15
features = ["relay"]
secrets = [
  "BUILDER_API_KEY",
  "BUILDER_PASS_PHRASE",
  "BUILDER_SECRET",
  "POLYMARKET_PRIVATE_KEY",
  "RELAYER_API_KEY",
  "RELAYER_API_KEY_ADDRESS",
]

[package.metadata.polyoxide.live.live_perps]
suite = "perps"
timeout = 15
features = ["perps"]
secrets = []

[package.metadata.polyoxide.live.live_perps_ws]
suite = "perps"
timeout = 15
features = ["perps-ws"]
secrets = []

[package.metadata.polyoxide.live.live_rtds]
suite = "rtds"
timeout = 15
features = ["rtds"]
secrets = []

[package.metadata.polyoxide.live.live_sports]
suite = "sports"
timeout = 20
features = ["sports"]
secrets = []
note = "20-minute budget for its 180 s wire-agreement window"

# The foundation crates' protected test names and probe that still name a
# Polymarket product or host (S2 may not rename a test, AD-12).
[[package.metadata.polyoxide.gate_exceptions]]
path = "polyoxide-ws/src/request.rs"
term = "perps"
reason = "the request-correlation tests of Story 4.2 model perps' answers in `mod perps`, and two of their protected names start `perps_`"

[[package.metadata.polyoxide.gate_exceptions]]
path = "polyoxide-ws/src/test_server/tests.rs"
term = "perps"
reason = "the scripted server's protected tests of Story 4.4 answer as perps does, in `mod as_perps_will_use_it` and its `Perps` answerer"

[[package.metadata.polyoxide.gate_exceptions]]
path = "polyoxide-ws/src/test_server/tests.rs"
term = "rtds"
reason = "the scripted server's protected tests of Story 4.4 replay rtds' old suite in `mod as_rtds_used_it`"

[[package.metadata.polyoxide.gate_exceptions]]
path = "polyoxide-ws/examples/close_reply_probe.rs"
term = "perps"
reason = "the probe of DRIFT R3 measured perps' public socket, its default host, `PERPS_WS_URL`"

[[package.metadata.polyoxide.gate_exceptions]]
path = "polyoxide-ws/examples/close_reply_probe.rs"
term = "polymarket"
reason = "the probe of DRIFT R3 defaults to perps' public socket on `ws.perpetuals.polymarket.com`"
