[package]
name = "polyoxide-polymarket"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust client library for Polymarket's APIs: CLOB, Gamma, Data, Relay, Perps, RTDS and Sports, each behind its own feature"
keywords = ["polymarket", "prediction-markets", "trading", "api", "websocket"]
categories = ["api-bindings", "web-programming::http-client", "web-programming::websocket"]

# One feature per module (Stories 5.3 to 5.5). The HTTP modules, `clob`,
# `gamma`, `data`, `relay` and `perps`, share the retry policy and their
# window-quota table, and clob and relay share the HMAC signer and the
# session-signer types. `rtds` and `sports` are sockets alone and build neither
# core nor `shared`. Only `clob` and `relay` build `alloy`, the signing stack:
# `.github/scripts/tests/test_dep_allowlists.py` holds every other feature to a
# tree without it, and `rtds` and `sports` to one without core's HTTP stack.
[features]
default = ["clob", "gamma", "data"]
clob = [
    "dep:polyoxide-core",
    "polyoxide-venue/market",
    "dep:base64",
    "dep:hmac",
    "dep:sha2",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tracing",
    "dep:url",
    "dep:alloy",
    "dep:hex",
    "dep:rand",
    "dep:rust_decimal",
    "dep:tokio",
    "tokio/time",
    "dep:urlencoding",
]
# The CLOB's two WebSocket channels, `clob::ws`.
clob-ws = [
    "clob",
    "dep:polyoxide-ws",
    "dep:futures-util",
    "polyoxide-venue/trading",
    "tokio/net",
    "tokio/macros",
    "tokio/sync",
]
gamma = [
    "dep:polyoxide-core",
    "polyoxide-venue/keys",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:url",
    "dep:chrono",
    "dep:tokio",
    "tokio/macros",
    "dep:urlencoding",
    "specta?/chrono",
]
data = [
    "dep:polyoxide-core",
    "polyoxide-venue/keys",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:url",
    "dep:futures-util",
    "dep:rust_decimal",
    "specta?/rust_decimal",
]
# The relay adds the chain RPC its gas estimation calls through alloy.
relay = [
    "dep:polyoxide-core",
    "dep:base64",
    "dep:hmac",
    "dep:sha2",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tracing",
    "dep:url",
    "dep:alloy",
    "alloy?/provider-http",
    "alloy?/rpc-types",
    "dep:hex",
    "dep:rand",
    "dep:tokio",
    "tokio/time",
]
perps = [
    "dep:polyoxide-core",
    "polyoxide-venue/market",
    "polyoxide-venue/decimal",
    "dep:rust_decimal",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tracing",
    "dep:url",
]
# Perps' six public WebSocket channels, `perps::ws`, on the socket kit's
# supervisor.
perps-ws = [
    "perps",
    "dep:polyoxide-ws",
    "dep:tokio",
    "tokio/time",
    "dep:futures-util",
]
# RTDS's crypto price streams. A socket alone: the kit, no core.
rtds = [
    "dep:polyoxide-ws",
    "dep:tokio",
    "tokio/time",
    "dep:futures-util",
    "dep:serde",
    "dep:serde_json",
    "dep:rust_decimal",
    "dep:thiserror",
    "dep:tracing",
    "dep:url",
]
# The live sports feed. A socket alone, like `rtds`.
sports = [
    "dep:polyoxide-ws",
    "dep:tokio",
    "tokio/time",
    "dep:futures-util",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tracing",
]
# Exposes each enabled socket module's captured frames, `rtds::fixtures` and
# `sports::fixtures`, so integration tests here and in polyoxide-cli use the
# unit tests' golden vectors. Not for consumers; the modules are
# `#[doc(hidden)]`, and docs.rs leaves the feature out.
test-server = []
# OS keychain storage for credentials. Its API is in `clob` and `relay`
# (`clob::save_private_key_to_keychain`, `relay::save_builder_config_to_keychain`
# and their `from_keychain` loaders), but cargo cannot say "only with clob or
# relay": it builds core's `keyring` whenever any module that uses core is on,
# `gamma` or `data` alone included.
keychain = ["polyoxide-core?/keychain"]
# Derives `specta::Type` on gamma's and data's response types; clob and relay
# derive none. Each of the two adds the specta extras its types need: `chrono`
# for gamma's dates, and `rust_decimal` for data's decimals, which are strings
# on the wire.
specta = ["dep:specta"]

[dependencies]
polyoxide-core = { workspace = true, optional = true }
polyoxide-venue = { workspace = true }
# EIP-712 signing and the chain types (`clob`, `relay`); the relay adds the
# chain RPC its gas estimation calls.
alloy = { version = "1.1.2", features = [
    "network",
    "signer-local",
    "signers",
    "sol-types",
], optional = true }
# The socket kit (`clob-ws`, `perps-ws`, `rtds`, `sports`): the TLS install,
# the bare tier, clob's upgrade over its own per-address connect, `WsError`,
# `Backoff` and perps' supervisor. It owns the transport, so this crate
# declares neither tokio-tungstenite nor rustls.
polyoxide-ws = { workspace = true, optional = true }
# The HMAC `Signer` (`clob`, `relay`).
base64 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# The session-signer types' wire form and the modules' types.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# The signer layer's refusal and its tier log line (`clob`), and the modules'
# errors and logs (every module but `gamma` and `data` logs).
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
# Gamma's dates (`gamma`); its batch fan-out, and the timers of clob, relay
# and the sockets (`gamma`, `clob`, `relay`, `perps-ws`, `rtds`, `sports`);
# path segments (`gamma`, `clob`).
chrono = { workspace = true, features = ["serde"], optional = true }
tokio = { workspace = true, optional = true }
urlencoding = { version = "2.1", optional = true }
# Data's v2 page streams and the sockets (`data`, `clob-ws`, `perps-ws`,
# `rtds`, `sports`); the decimals of data, clob, perps and rtds.
futures-util = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
# Addresses and salts of clob and relay (`clob`, `relay`).
hex = { workspace = true, optional = true }
rand = { version = "0.9.2", features = ["std"], optional = true }
specta = { version = "=2.0.0-rc.20", features = ["derive", "serde"], optional = true }

[dev-dependencies]
# The live suites' failure tags and credential loaders, and the agreement and
# soak helpers (`query` fires a builder at a mock server; `soak` is the
# harnesses' pacer, observer and verdicts). Path-only: it is never published,
# and cargo strips a path-only dev-dependency on publish.
polyoxide-test-support = { path = "../polyoxide-test-support", features = ["query", "soak"] }
# The shared scripted WebSocket server the offline socket suites of clob,
# perps, rtds and sports run on. Path-only, so cargo strips it on publish.
polyoxide-ws = { path = "../polyoxide-ws", features = ["test-server"] }
mockito = { workspace = true }
serde_json = { workspace = true }
dotenvy = "0.15"
futures-util = { workspace = true }
rust_decimal_macros = "1.37"
# `test-util` gives the cooldown tests a paused clock, so they assert the full
# backoff without actually sleeping for it.
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util", "time"] }
# The send loop's tests read its warnings.
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

