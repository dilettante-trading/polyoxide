schema = 1                      # flow profile schema version

prefix = "direnv exec . env CARGO_INCREMENTAL=0"  # flake.nix's dev shell: Rust 1.99.0, msrv-cargo (1.91.0), cargo-hack, cargo-semver-checks, cargo-nextest, uv, python3 (flake.nix:34-69), loaded from nix-direnv's cache by the main checkout's untracked .envrc (`use flake`), which a worktree finds above it. Not `nix develop --command`: each run leaves a /tmp/nix-shell.* directory behind, and nix-direnv deletes its own (owner, 2026-11-03). `env CARGO_INCREMENTAL=0` (flow retro, 2026-11-03): the shared /tb volume filled in 9 of the 12 runs of 2026-10-31 to 11-03, a worktree's target/debug/incremental held 15G in the Binance spot REST run, and sccache, the system RUSTC_WRAPPER, caches no incremental build

services = []                   # CLAUDE.md names no service to start before tests; live tests are #[ignore]d (CLAUDE.md:546)

generated = [
  "docs/ARCHITECTURE.md",       # copied from the spine by gen_registry.py --write, never edited by hand (CLAUDE.md:11)
  "docs/rename-map.tsv",        # S2's frozen rename map; no S3 job writes it (CLAUDE.md:60)
  "ci/dep-allowlists/*.txt",    # regenerated by `uv run python -m tests.test_dep_allowlists --write` in .github/scripts (CLAUDE.md:58)
  "target/**",                  # build output (.github/workflows/ci.yml:191,198,203)
  "Cargo.lock",                 # cargo writes it; the package job runs with --locked (.github/workflows/ci.yml:74)
  "flake.lock",                 # nix flake lock / nix flake update writes it
  "**/uv.lock",                 # uv sync writes polyoxide-py/uv.lock and .github/scripts/uv.lock (.github/workflows/ci.yml:248,268)
]
# Not globbed: files that hold generated regions among hand-written text, which plans do edit.
# docs/rename-manifest.md has manifest:begin regions, and plans add its rows by hand (CLAUDE.md:60);
# README.md, CLAUDE.md, SELF-HEALING.md, docs/specs/INDEX.md and the two nightly workflows have
# generated:begin regions (CLAUDE.md:75).

[gates]
story = [
  "cargo fmt --all -- --check",                                                            # CLAUDE.md:46; .github/workflows/ci.yml:28
  "cargo clippy {packages} --all-targets --all-features -- -D warnings",                   # CLAUDE.md:40; .github/workflows/ci.yml:42
  "cargo test {packages} --all-features",                                                  # CLAUDE.md:31,34; one command for ci.yml:43-44 (nextest, then doctests) that suits any package selection; the final check gate runs nextest as CI does
  "bash -c 'RUSTDOCFLAGS=\"-D warnings\" cargo doc --no-deps {packages} --all-features'",  # CLAUDE.md:43,64 (a pub doc linking a pub(crate) item fails only here); .github/workflows/ci.yml:48-50
  "python3 scripts/gen_registry.py --check",                                               # check-only; --write rewrites the regions (scripts/gen_registry.py:12-13,77; CLAUDE.md:75)
  "python3 scripts/venue_gate.py",                                                         # foundation crates name no venue (CLAUDE.md:58); takes no arguments (scripts/venue_gate.py:295-296)
  "python3 scripts/live_unwraps.py",                                                       # check mode; --lower rewrites the baseline (scripts/live_unwraps.py:410-415)
  "python3 scripts/test_body_diff.py --baseline v0.40.0",                                  # CLAUDE.md:62; S3_BASELINE (.github/workflows/ci.yml:12,210)
]

# One command per CI job, each run inside the dev shell (prefix).
final = [
  "cargo fmt --all -- --check",                                                            # format: .github/workflows/ci.yml:28
  "bash -c 'cargo clippy --all-targets --all-features -- -D warnings && cargo nextest run --all-features --workspace && cargo test --doc --all-features --workspace && RUSTDOCFLAGS=\"-D warnings\" cargo doc --no-deps --all-features --workspace'",  # check (Lint & Test): .github/workflows/ci.yml:42-50
  "bash -c 'python3 scripts/publish_order.py check-manifests && cargo publish --workspace --dry-run --no-verify --locked && for m in tombstones/*/Cargo.toml; do [ -e \"$m\" ] || continue; cargo package --no-verify --manifest-path \"$m\" || exit 1; done'",  # package: .github/workflows/ci.yml:71,74,81-85
  "bash -c 'msrv-cargo check --workspace --all-features && msrv-cargo doc --no-deps --workspace --all-features'",  # msrv: .github/workflows/ci.yml:94,98-99 (warnings allowed, as there); msrv-cargo runs the 1.91.0 toolchain into target/msrv (flake.nix:48-53)
  "bash -c 'cargo hack check --workspace --each-feature --no-dev-deps --ignore-private && for m in clob gamma data relay perps; do cargo test -p polyoxide-polymarket --no-default-features --features $m --test headers_$m || exit 1; done && cargo test -p polyoxide-binance --no-default-features --features usdm --test headers_usdm && { [ ! -d polyoxide-kalshi ] || cargo test -p polyoxide-kalshi --no-default-features --features predictions --test headers_predictions; } && for m in clob gamma data relay perps; do cargo test -p polyoxide -p polyoxide-polymarket --features polyoxide/full --test headers_$m || exit 1; done && cargo test -p polyoxide -p polyoxide-binance --features polyoxide/full --test headers_usdm && { [ ! -d polyoxide-kalshi ] || cargo test -p polyoxide -p polyoxide-kalshi --features polyoxide/full --test headers_predictions; } && cargo test -p polyoxide-polymarket --no-default-features --features clob --test mock_clob -- a_proxy_order_with_no_funder_is_refused_without_gamma --exact && for m in clob gamma data relay perps; do cargo check -p polyoxide-polymarket --no-default-features --features $m,specta || exit 1; done'",  # features: .github/workflows/ci.yml:117,125-130,137-142,150,153-157 (each loop is those lines written once); cargo-hack 0.6.45, CI's pin (ci.yml:113); polyoxide-kalshi's two pins (Epic 8, spec docs/superpowers/specs/2026-10-18-epic-8-kalshi-walking-skeleton-design.md D20) run only where its directory exists, since every worktree shares this profile and those that predate Epic 8 have no such crate
  "python3 scripts/api_removals.py check --baseline v0.40.0",                              # removals: .github/workflows/ci.yml:12,191; Rust 1.99.0 and cargo-semver-checks 0.51.0, CI's pair
  "python3 scripts/test_body_diff.py --baseline v0.40.0",                                  # test-bodies: .github/workflows/ci.yml:12,210
  "bash -c 'cd polyoxide-py && uv sync --reinstall-package polyoxide && uv run pytest tests/ -v'",  # python: .github/workflows/ci.yml:248-251; --reinstall-package rebuilds the extension, which plain `uv sync` leaves stale outside CI's fresh checkout (memory: polyoxide-py-stale-extension)
  "bash -c 'cd .github/scripts && uv sync && uv run pytest tests/ -v'",                    # scripts (CI Scripts): .github/workflows/ci.yml:268-271
  "bash -c '[ ! -e scripts/wasm_check.sh ] || { bash scripts/wasm_check.sh && bash scripts/wasm_smoke.sh; }'",  # wasm: .github/workflows/ci.yml:266-287 on aidanb/wasm (spec docs/superpowers/specs/2026-11-02-wasm-runtime-transport-design.md D13); the wasm32 check and clippy, then the headless-Chrome smoke suite in a dedicated Worker. Runs only where scripts/wasm_check.sh exists, since every worktree shares this profile and those that predate the wasm run have neither script (owner, 2026-11-03)
]

vacuous = [
  '\b0 passed; 0 failed; \d+ ignored; 0 measured; [1-9]\d* filtered out',  # cargo test: only a name filter leaves a nonzero "filtered out" beside 0 passed, so a binary with no tests ("0 filtered out") never matches; a name-filtered cargo test must name its binary (--lib, --test <name>), as ci.yml:150 does
  '^collected 0 items',   # pytest collected nothing (the python and scripts jobs run pytest, .github/workflows/ci.yml:250,270); wording from pytest, not the repo
  'no tests ran',         # pytest's summary line when nothing ran; same caveat
]

[build]
exclusive = ["cargo", "uv", "api_removals.py"]
# check_plan matches each entry as a substring of a story's Verify line (check_plan.py:98-101), so "cargo"
# also covers `cargo hack` and `cargo nextest`. "uv" covers `uv sync` and `uv run` in polyoxide-py, which
# build the PyO3 extension through maturin and cargo (polyoxide-py/pyproject.toml:2-3), and in .github/scripts,
# whose tests run cargo tree (CLAUDE.md:58). "api_removals.py" runs rustdoc and cargo-semver-checks over every
# crate (.github/workflows/ci.yml:203) with no "cargo" in its command line.

[landmines]
markers = [
  "allow_burst(",             # a window quota given depth (CLAUDE.md:272); today only in an example's history comments
  "RESERVED_FRACTION",        # the margin under a published quota (CLAUDE.md:278); polyoxide-core/src/rate_limit.rs and polyoxide-binance/src/usdm/weight.rs
  ".gzip(",                   # setting gzip on a client (CLAUDE.md:419-426); core's setter, and the pinned examples and tests
  "connect_async(",           # a socket connect that skips the kit (CLAUDE.md:629); only the kit's connect.rs and its test server
  "From<reqwest::Error>",     # a foreign error entering a module outside ApiError (CLAUDE.md:242); appears nowhere today
  "From<serde_json::Error>",  # same rule (CLAUDE.md:242)
  "From<url::ParseError>",    # same rule (CLAUDE.md:242)
]

notes = [
  "Giving a window quota depth: calling `allow_burst` on it, or giving WindowQuotaTable a burst setting. A bucket that starts full admits its depth plus everything the refill adds, so its first window lets through twice the published count; every table over-permitted by exactly 2x until this was measured. The per-signer CapacityBucket is the opposite model and must hold its published burst, so making the two modules consistent reintroduces the bug (CLAUDE.md:272-276).",
  "Changing `RESERVED_FRACTION`, or aiming any quota at the published count. The count is reachable as a burst but not as a rate: on /closed-positions, 100% of 150 per 10 s was refused after 15.7 s and 90% ran clean for 180 s (CLAUDE.md:278-286).",
  "Calling `.gzip(...)` on a client builder, or adding a gzip knob to ClientConfig. Unset keeps reqwest's default, so every client asks for gzip; 0.37.0 forced it off and took compression away from consumers until 0.37.1. Only four rate-limit examples pin `.gzip(false)`, on bare clients, to keep the wire their soaks were measured on (CLAUDE.md:419-426).",
  "Calling `tokio_tungstenite::connect_async` outside polyoxide-ws, or giving a crate its own `ensure_crypto_provider`. reqwest and alloy enable ring and aws-lc-rs on one rustls, which then installs no default CryptoProvider, so a direct connect panics; the kit's `connect` and `connect_over` install one (CLAUDE.md:613,629).",
  "Implementing `From<reqwest::Error>`, `From<serde_json::Error>` or `From<url::ParseError>` on a module error. Foreign errors enter a module only through ApiError (`.map_err(ApiError::from)?`), so each module's `From<ApiError>` stays its one decode and a `?` on core's error decodes the same everywhere (CLAUDE.md:242).",
  "Shortening a wait: obeying a Retry-After that floors to zero, or letting a newer cooldown truncate an older one. A zero Retry-After once put three retries inside 65 ms and extended the ban they were waiting on; `polyoxide_venue::retry_delay` is the one place the floor lives, and `Hold::wait` re-checks after waking so an extended hold is honoured in full (CLAUDE.md:265-270).",
  "A second retry or sleep loop outside `HttpClient::send`, or bringing back `should_retry`, `note_rate_limited` or `acquire_rate_limit`. The send loop is core's only retry loop; another one skips the policy's hold, the Retry-After floor and the throttle (CLAUDE.md:246).",
  "A match over `tungstenite::Error`'s variants outside polyoxide-ws. Every socket error is classified once, on `polyoxide_venue::impl_ws_classification!`, so a second match lets a venue's classes drift from the table. No marker: `tungstenite::Error` is built legitimately in many error tests (CLAUDE.md:244).",
  "Editing a vendored upstream mirror under docs/specs/ (an OpenAPI or AsyncAPI file that nightly-schema.yml watches). A mirror must stay byte-faithful or the nightly drift check alarms forever; observations go beside it in OBSERVED.md (CLAUDE.md:511-513).",
  "Changing `[workspace.metadata.polyoxide] stage` in the root Cargo.toml. The stage selects the removals gate: S3's `api_removals.py check --baseline v0.40.0`, the gate this profile runs (Cargo.toml:72-76; CLAUDE.md:60).",
  "Raising one of the pinned pair, cargo-semver-checks 0.51.0 and Rust 1.99.0, without the other, or in only some of ci.yml, release.yml and flake.nix. The tool reads only the rustdoc JSON some toolchains emit (CLAUDE.md:60). `nix flake update` can move cargo-hack and cargo-semver-checks off CI's pins, since flake.nix takes both from nixpkgs; check their versions in the shell after one (flake.nix:60-63).",
  "Anything that publishes: `scripts/finish_release.sh`, `cargo publish` without `--dry-run`, or `gh workflow run Release`. A release cannot be taken back, since no old version is ever yanked, and every publish is `--no-verify`; a version bump is its own commit on main (CLAUDE.md:60,643,655,665).",
]

[review]
idioms = [
  "Tests assert the counterparty's value, not its shape: a rate-limit agreement test asserts the effective quota a request resolves to, signing and encoding tests are pinned to py-sdk's golden vectors and never to a self-computed value, and a check that a value is 'a positive Decimal' passes on both RTDS scales (CLAUDE.md:261,536,633).",
  "A fix or a new rule comes with a test shown to fail without it; a moved line or test that docs/MUTANTS.md cites has its row moved and its mutant re-proved (CLAUDE.md:15).",
  "A commit that changes a rule CLAUDE.md states edits that rule's text in the same commit (AD-21), outside the generated regions (CLAUDE.md:13,75).",
  "A new error enum is `#[non_exhaustive]`, is decoded in its module's one `From<ApiError>`, and has no inherent `is_retriable` or `retry_after`: retriability is `Classify::is_retriable()`, from a class decided by the status before the body (CLAUDE.md:242-248).",
  "Builders, accessors, setters and wire enums come from the shared macros (`client_config_setters!`, `namespaces!`, `query_setters!`, `wire_enum!` and `open_enum!`), hand-written only where CLAUDE.md lists the exception, and a new query setter is pinned in its module's query-setters test (CLAUDE.md:200,208,219,292).",
  "A rate-limit or weight row is measured against the live host over distinct URLs, with the path probed on that host first, and recorded in OBSERVED.md; it is never copied from a published table (CLAUDE.md:263,338-339,482).",
  "The two EIP-712 domains and the three signing schemes stay apart, and a session key's role is never inferred from addresses (CLAUDE.md:221-240).",
  "A live test fails through the test-support tags (`.or_fail`, `fail`, the credential loaders, `environmental`, `transient`) and is `#[ignore]`d (CLAUDE.md:546,592).",
  "Price and size fields are `rust_decimal::Decimal` with `serde(with = \"rust_decimal::serde::str\")` (CLAUDE.md:290).",
  "A new CLI command follows `polyoxide <venue> <module> <verb…>`, prints a stream through `stream::OutputFormat`, and is driven by scripted events in a test (CLAUDE.md:97,114,120-122).",
  "A removal or another major-level change raises the 0.x minor in a separate version-bump commit on main (CLAUDE.md:60).",
  "A commit that regenerates ci/dep-allowlists says why (CLAUDE.md:58).",
]

[paths]
state = ""
records = ""
