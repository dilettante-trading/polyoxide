[package]
name = "polyoxide-rtds"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust client for Polymarket's Real-Time Data Service (RTDS) crypto price streams"
keywords = ["polymarket", "websocket", "chainlink", "twap", "prices"]
categories = ["api-bindings", "web-programming::websocket"]

[features]
# Exposes the captured wire frames in `fixtures` so integration tests under
# `tests/` can use the same golden vectors as the unit tests. Not intended
# for library consumers; the module is `#[doc(hidden)]`.
test-fixtures = []

[[test]]
# Imports `fixtures`, which only exists behind `test-fixtures` (see the
# feature comment below). Without `required-features`, a plain
# `cargo test --all-targets` (no `--features`) would try to build this target
# and fail with an unresolved import instead of just skipping it.
name = "supervision"
required-features = ["test-fixtures"]

[dependencies]
tokio = { workspace = true, features = ["macros", "net", "time", "rt"] }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
# Needed only to install a process-default rustls CryptoProvider. See the
# comment on `ensure_crypto_provider` in src/client.rs.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
