[package]
name = "polyoxide-rtds"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust client for Polymarket's Real-Time Data Service (RTDS) crypto price streams"
keywords = ["polymarket", "websocket", "chainlink", "twap", "prices"]
categories = ["api-bindings", "web-programming::websocket"]

[features]
# Exposes the captured wire frames in `fixtures` so integration tests under
# `tests/` can use the same golden vectors as the unit tests. Not intended
# for library consumers; the module is `#[doc(hidden)]`. Named `test-server`
# as every other crate's is (DRIFT R6); it was `test-fixtures`.
test-server = []

[[test]]
# Imports `fixtures`, which only exists behind `test-server` (see the
# feature comment above). Without `required-features`, a plain
# `cargo test --all-targets` (no `--features`) would try to build this target
# and fail with an unresolved import instead of just skipping it.
name = "supervision"
required-features = ["test-server"]

[dependencies]
polyoxide-venue = { workspace = true }
# The socket kit: connect with a timeout, which installs the TLS provider, the
# bare tier `Connection`, the one socket error and `Backoff`. It owns the
# transport, tokio-tungstenite and rustls.
polyoxide-ws = { workspace = true }
tokio = { workspace = true, features = ["time"] }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The live suites' failure tags and credential loaders. Path-only: it is never
# published, and cargo strips a path-only dev-dependency on publish.
polyoxide-test-support = { path = "../polyoxide-test-support" }
# The shared scripted WebSocket server the offline suites run on. Path-only,
# so cargo strips it on publish.
polyoxide-ws = { path = "../polyoxide-ws", features = ["test-server"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Registration, read by scripts/gen_registry.py: the README line, venue and
# product ids, the docs/specs/ mirrors covered, and one entry per live test
# target, which becomes a nightly job. Run `python3 scripts/gen_registry.py
# --write` after an edit.
[package.metadata.polyoxide]
readme = "Client for Polymarket's RTDS crypto price streams"
venue = "polymarket"
products = ["rtds"]
mirrors = ["rtds"]
notes = ["no `polyoxide-core`, `reqwest` or `alloy`, so a credential-free price feed builds no HTTP or signing stack"]

[package.metadata.polyoxide.live.live_api]
suite = "live"
timeout = 15
features = []
secrets = []
