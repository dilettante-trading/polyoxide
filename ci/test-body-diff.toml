# What scripts/test_body_diff.py may not hold against the S3 baseline, and why.
#
# The script pairs every test-context item at the baseline (CI's `S3_BASELINE`)
# with its counterpart at HEAD and compares the two after normalising them through
# docs/rename-manifest.md's path rows. Each section below covers what the manifest
# cannot. Every entry must match something: one that pairs, replaces, acknowledges
# or retires nothing fails the job, so the file never outlives what it explains.
#
# An item is named by its file at the baseline, its kind (`fn` unless given), and
# `item`, its inline module path and name as the script prints them. The kinds are
# `fn`, `const`, `static`, `struct`, `enum`, `union`, `type`, `extern`, `macro` for a
# `macro_rules!`, `invocation` for an item-level macro call, `method`, `assoc_const`
# and `assoc_type` for what an `impl` or `trait` holds, `target` for a manifest's
# `[[test]]` or `[[example]]` stanza, named `[[test]]` and filed under its target's
# file, and `fixture` for a file under a `tests/fixtures/`, named by its file name.
# Examples: `tests::frame_decodes`, `_#1` for a module's first `const _`,
# `agreement!#1` for its first `agreement! { ... }`, and
# `<impl Throttle for Recorder>::acquire`.
#
# [files]
#   "<baseline file>" = "<file at HEAD>"
#   Pairs two files that `git diff -M30%` does not, or pairs differently. An item is
#   first looked for in its file's pair, so a test file split or merged below 30%
#   similarity needs one line here per baseline file, which must hold an item.
#
# [literals]
#   "<content at the baseline>" = "<content at HEAD>"
#   Replaces a baseline string literal whose content is exactly the key, before the
#   comparison: a tracing target such as "polyoxide_clob", or a fixture directory.
#   A key that names a table instead scopes its literals to the baseline files at or
#   under that path, matched at a `/`, and the longest scope wins:
#     [literals."polyoxide-clob"]
#     "ws" = "clob-ws"
#   An `include_str!` or `include_bytes!` target needs no line: it compares by the
#   content of the file it names. Each literal must replace something.
#
# [fixtures]
#   "<baseline path prefix>" = "<subdirectory>"
#   Reads each baseline `fixtures!()` call at or under the prefix, matched at a `/`,
#   as `fixtures!("<subdirectory>")`, and each `fixtures!("x")` as
#   `fixtures!("<subdirectory>/x")`, for a crate whose `tests/fixtures/` moved
#   under a module's `tests/fixtures/<module>/`. A no-argument call has no literal
#   for `[literals]` to replace. It applies before `[literals]`, so a literal key
#   never matches a call's rewritten argument. The longest prefix wins, and each
#   entry must rewrite a call.
#
# [paths]
#   "<old path>" = "<new path>"
#   Maps a path the rename manifest does not hold, because it was never public, such
#   as `polyoxide_core::polymarket::limits` moving into `polyoxide_polymarket`'s
#   private `src/shared/`. It applies on the baseline side as a manifest path row
#   does, after the manifest's rows, and wins over one with the same old path. Each
#   entry must rewrite or rename something.
#
# [gates]
#   "<HEAD path prefix>" = "<feature>", or = ["<feature>", ...]
#   Drops a module's feature gate at HEAD, for a crate root that became the module
#   `src/<m>/mod.rs` under `#[cfg(feature = "<m>")] pub mod <m>;`, or a test directory
#   whose targets require a module's features. For every HEAD item at or under the
#   prefix, matched at a `/`, it drops exactly `cfg(feature = "<feature>")` from what
#   gates it, from a `mod x;`, an enclosing module or the file's inner `cfg`, and that
#   operand from a top-level `cfg(all(...))`; and it drops `<feature>` from the
#   `required-features` of every stanza whose target is there. Any other gate stays.
#   A value may instead be a whole cfg predicate, what goes inside `cfg(...)`, told
#   from a feature by its `(` or `=`:
#     "polyoxide-y/src/shared/auth.rs" = 'any(feature = "clob", feature = "relay")'
#   It drops exactly that `cfg(...)`, compared token by token, and that operand from
#   a top-level `cfg(all(...))`, but never a `required-features` entry, which names
#   features only. Each feature and each predicate must drop something.
#
# [[drift]]
#   file   = "<baseline file>"
#   item   = "<module path and name>"
#   kind   = "fn"                       (optional)
#   row    = "R6"                       a DRIFT row of divergences.md
#   sha256 = "<the diff's sha256>"      as the script prints it
#   Acknowledges one diff, which the named DRIFT row decided. The sha256 pins that
#   exact diff, so any further change to either side shows again.
#
# [[retired]]
#   file = "<baseline file>"
#   item = "<module path and name>"
#   kind = "fn"                         (optional)
#   row  = "<old path in docs/rename-manifest.md>"
#   removal = "<a key under ## Removed in the stage's listing>"    in place of `row`
#   Lets a test go with its subject, and gives exactly one of `row` and `removal`.
#   The manifest row covering `row`, the longest old path that is a prefix of it at
#   `::`, must give a reason, not a new path. A `removal` must be a key the stage's
#   removal listing (docs/s3-removals.md in S3) holds under `## Removed`: S3's way,
#   since the manifest is S2's and final.
#
# Add each [[drift]] or [[retired]] entry below as its own table. S2's entries
# went with the switch to S3, whose baseline is the S2 release.

# The kit's host-only code is gated off wasm32 (the wasm32 seams' story 7): the scripted
# test server and the TLS install sit under `not(target_arch = "wasm32")`, which changes no
# test's body, only what gates it, so the gate is dropped at HEAD. Test-support's modules are
# gated the same way (story 10), since only its failure tags build in a browser.
# Data API v1 is retired (2026-11-02) and v2 is the data module's root: its v2 test
# files and the v2 error module merged into the module's own (DRIFT R27).
[files]
"polyoxide-polymarket/tests/mock_data_v2.rs" = "polyoxide-polymarket/tests/mock_data.rs"
"polyoxide-polymarket/src/data/v2/error.rs" = "polyoxide-polymarket/src/data/error.rs"

# `data::v2::*` is `data::*`, and the v2 error is the module's venue error.
[paths]
"polyoxide_polymarket::data::v2" = "polyoxide_polymarket::data"
"polyoxide_polymarket::data::v2::error::V2Error" = "polyoxide_polymarket::data::error::VenueError"

# The v2 fixtures moved up from `tests/fixtures/data/v2/` to `tests/fixtures/data/`.
[literals."polyoxide-polymarket/tests"]
"data/v2" = "data"

[literals."polyoxide-cli/tests"]
"/../polyoxide-polymarket/tests/fixtures/data/v2" = "/../polyoxide-polymarket/tests/fixtures/data"

[gates]
"polyoxide-ws/src/test_server" = 'not(target_arch = "wasm32")'
"polyoxide-ws/src/tls.rs" = 'not(target_arch = "wasm32")'
"polyoxide-test-support/src/agreement" = 'not(target_arch = "wasm32")'
"polyoxide-test-support/src/creds.rs" = 'not(target_arch = "wasm32")'
"polyoxide-test-support/src/fixtures.rs" = 'not(target_arch = "wasm32")'
"polyoxide-test-support/src/minute.rs" = 'not(target_arch = "wasm32")'
"polyoxide-test-support/src/openapi.rs" = 'not(target_arch = "wasm32")'
"polyoxide-test-support/src/query.rs" = 'not(target_arch = "wasm32")'
"polyoxide-test-support/src/soak" = 'not(target_arch = "wasm32")'

