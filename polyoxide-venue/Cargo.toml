[package]
name = "polyoxide-venue"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared vocabulary for the polyoxide venue clients: error classes, the status and close-code maps, the Retry-After parser, wire enums, positional decimals and Unix-millisecond time"
keywords = ["trading", "errors", "retry", "rate-limit"]
categories = ["api-bindings"]

# Nothing by default. AD-3 allows rust_decimal, serde, thiserror, futures-core
# and dynosaur; each arrives with the first item that needs it, behind a
# feature where a crate that depends on this one may not want it, so the
# socket-only crates build nothing they do not use.
[dependencies]
# The `Dyn` wrappers of the market-data traits (`market`), as core's hooks
# have theirs.
dynosaur = { workspace = true, optional = true }
# The `Stream` of `TradingEvents` (`trading`).
futures-core = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[features]
# `positional`: the decimal-string helpers for rows sent as bare arrays.
decimal = ["dep:rust_decimal", "dep:serde"]
# `MarketKey`, `RawKey`, `KeySpace` and `KeyError`: one canonical name per
# instrument, which serializes as its text form.
keys = ["dep:serde"]
# The market-data traits (`MarketData` and the capability traits, each with
# its `Dyn` wrapper), the records they return, and `Extensions`, the venue's
# own facts on a record.
market = ["keys", "decimal", "dep:dynosaur"]
# The `Trading` trait (with its `Dyn` wrapper), the order, fill, position and
# balance records, the opaque order, fill and client-order ids, and the
# `TradingEvents` stream.
trading = ["market", "dep:futures-core"]

# The enum macros' own tests: the expansion names `::serde`, which a calling
# crate provides.
[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# `impl_ws_classification!`'s table test and doc example expand it against
# `polyoxide_ws::WsError`, as a venue crate does. Path-only, so cargo strips
# it on publish and the normal build stays free of any socket dependency.
polyoxide-ws = { path = "../polyoxide-ws" }
# `tests/trading.rs` drives the event stream from a spawned task and from
# polled-once futures.
futures-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

# docs.rs documents `positional`, the keys, the records and the trading
# vocabulary, which only their features build.
[package.metadata.docs.rs]
features = ["decimal", "keys", "market", "trading"]

# Registration, read by scripts/gen_registry.py: the README line, venue and
# product ids, the docs/specs/ mirrors covered, and one entry per live test
# target, which becomes a nightly job. Run `python3 scripts/gen_registry.py
# --write` after an edit.
[package.metadata.polyoxide]
readme = "Shared vocabulary: error classes, the status and close-code maps, the socket classification table (`impl_ws_classification!`), the `Retry-After` parser, the wire-enum macros and `UnknownVariant`, positional decimal serde (feature `decimal`), `UnixMillis`, market keys (feature `keys`: `MarketKey`, `RawKey` and the `KeySpace` a venue implements per product), the market-data traits with the records they return and their typed `Extensions` (feature `market`), and the `Trading` trait with its order, fill, position and balance records and its `TradingEvents` stream (feature `trading`)"
notes = ["every public error type in the workspace implements its `Classify` trait but `polyoxide-ws`'s `WsError`, which `impl_ws_classification!` classifies in each venue crate that wraps it; by default it depends on nothing, and it has no HTTP, socket or signing dependency"]
