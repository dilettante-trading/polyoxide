[package]
name = "polyoxide-venue"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared vocabulary for the polyoxide venue clients: error classes, the status and close-code maps, and the Retry-After parser"
keywords = ["polymarket", "trading", "errors", "retry"]
categories = ["api-bindings"]

# Nothing yet. AD-3 allows rust_decimal, serde, thiserror, futures-core and
# dynosaur; each arrives with the first item that needs it, so the socket-only
# crates that depend on this one build nothing they do not use.
[dependencies]

# Registration, read by scripts/gen_registry.py: the README line, venue and
# product ids, the docs/specs/ mirrors covered, and one entry per live test
# target, which becomes a nightly job. Run `python3 scripts/gen_registry.py
# --write` after an edit.
[package.metadata.polyoxide]
readme = "Shared vocabulary: error classes, the status and close-code maps, the `Retry-After` parser"
notes = ["every public error type in the workspace implements its `Classify` trait; it has no HTTP, socket or signing dependency"]
