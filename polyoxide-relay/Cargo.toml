[package]
name = "polyoxide-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust client library for Polymarket Relayer API"
keywords = ["polymarket", "prediction-markets", "trading", "relayer"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = []
keychain = ["polyoxide-core/keychain"]

[dependencies]
alloy = { version = "1.1.2", features = [
    "network",
    "provider-http",
    "rpc-types",
    "signer-local",
    "signers",
    "sol-types",
] }
polyoxide-core = { workspace = true }
polyoxide-venue = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
url = { workspace = true }
hex = { workspace = true }
rand = { version = "0.9.2", features = ["std"] }

[dev-dependencies]
# The live suites' failure tags and credential loaders. Path-only: it is never
# published, and cargo strips a path-only dev-dependency on publish.
polyoxide-test-support = { path = "../polyoxide-test-support" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15"
mockito = { workspace = true }

# Registration, read by scripts/gen_registry.py: the README line, venue and
# product ids, the docs/specs/ mirrors covered, and one entry per live test
# target, which becomes a nightly job. Run `python3 scripts/gen_registry.py
# --write` after an edit.
[package.metadata.polyoxide]
readme = "Client library for Polymarket Relayer API (gasless transactions)"
venue = "polymarket"
products = ["relay"]
mirrors = ["relay", "session-keys"]

[package.metadata.polyoxide.live.live_api]
suite = "live"
timeout = 15
features = []
secrets = [
  "BUILDER_API_KEY",
  "BUILDER_PASS_PHRASE",
  "BUILDER_SECRET",
  "POLYMARKET_PRIVATE_KEY",
  "RELAYER_API_KEY",
  "RELAYER_API_KEY_ADDRESS",
]
