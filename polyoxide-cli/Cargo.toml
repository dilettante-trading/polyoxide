[package]
name = "polyoxide-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI tool for querying Polymarket Gamma API"
keywords = ["polymarket", "prediction-markets", "cli", "gamma"]
categories = ["command-line-utilities"]

[features]
default = []
keychain = ["polyoxide-clob/keychain", "dep:polyoxide-core", "dep:polyoxide-relay"]

[[bin]]
name = "polyoxide"
path = "src/main.rs"

[dependencies]
polyoxide-clob = { workspace = true, features = ["ws"] }
polyoxide-core = { workspace = true, optional = true, features = ["keychain"] }
polyoxide-relay = { workspace = true, optional = true, features = ["keychain"] }
polyoxide-data = { workspace = true }
polyoxide-gamma = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
serde_json = { workspace = true }
color-eyre = "0.6"
futures-util = "0.3"
ctrlc = "3.4"
